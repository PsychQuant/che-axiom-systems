# ASBE Domain — Academic Writing
# Follows templates/domain-template.yaml. Validate with /axiom-validate.

meta:
  domain: "Academic Writing"
  version: "1.0.0"
  author: "Che Cheng"
  created: "2026-10-10"
  source: "Revision of a philosophy manuscript (Leibniz on machine-generated proofs, for Synthese), 2026-10-10"
  provenance: |
    Seeded at the user's request, in their words:
      「幫我寫在rule裡面與 axiomsystem裡面不能前向引用（所有文章都不適合，除非有例外）」
    The request arose while removing a forward reference from the manuscript
    cited in A1's examples (commits 543f22b → a0f987a).
  description: |
    Axiomatizes the craft of writing scholarly articles for peer readers in
    any discipline — philosophy, the empirical sciences, mathematics: how the
    argument is laid out so that a reader moving through the text in order
    can follow and check it. Distinct from `mathematical-writing`, which
    covers formal mathematical exposition (the theorem / proposition /
    definition / remark architecture); where an axiom here generalizes one
    there, the axiom names its parent by id. Distinct from `apa7-style`,
    which covers formatting and citation style rather than the order and
    structure of an argument. Seeded with reading-order dependence (A1).
    A2 (each element called for by what precedes it) was added on 2026-11-23.
    A3 (each object introduced with its own literature; the broad review
    later) was added on 2026-11-23, at the author's request, in their words:
      「在academic writing的時候應該說每一個東西被介紹出來的時候，都會跟著短短的一兩句的
      literature review，然後大範圍的review才會放後面專門章節。因為漸近有效是很重要的特性，
      所以第一次就可以介紹」「這是academic writing的 axiom」
    A4 (in the Introduction, the article's own results come after the
    research question) was added on 2026-11-23, at the author's request, in
    their words:
      「在學術寫作的axiom裡面可以說通常是到引言的研究問題出來知後才會說一些自己的研究結果吧」
    A5 to A9 (the flow of an article: a frame for a discussion by cases,
    each topic treated in one place, no question left open, the legitimate
    rearrangement operations, and the list of contributions, the figures
    and tables and the appendix planned with the flow) were added on
    2026-11-26, at the author's request, in their words, said while
    reading the flow of a manuscript:
      「你也順便把這個加入che-axioms裡面當作學術寫作需要注意的事情」
      A5: 「如果要討論case的話需要有順序、完整的討論比較好」
          「我講得沒有架構就是你討論case的時候不會有整個框架與照順序。」
      A6: 「通常flow 一個case討論過就不太會回來討論，要講究一次講完」
          「應該flow要順不要重複走回來，這是一個規則。」
      A7: 「別人看到這裡的時候，不會覺得困惑（confusing），就是她們閱讀這個flow的時候
          可以隨時提出問題，我們必須要照這這個flow的時候不會有困惑」
      A8: 「flow本身為了要順是可以進行 rearrangement的，這可以寫成一個axiom說合理的
          operation有哪些。」
      A9: 「我發現flow需要有另外一個輔助的東西叫作contributions」
          「你再flow的地方思考結構的時候也要想figure跟table可能是必要的」
          「flow裡面也要說哪些東西要放在appendix」
    On the same day two examples were added under A1 for the announcement
    of a complete worked example that is given later. The announcement is
    exception (1) of A1 and not a third exception. The author's words:
      「這邊是前向引用的例外，因為這是後面有一個具體的完整example。……這是少數例外」
    The rule on the order of a general and a simple case, from the same
    reading, is mathematical-writing A7_general_case_first.

# Primitive terms — undefined concepts that form the foundation
primitives:
  - term: "Reading order"
    intuition: |
      The order in which a reader meets the sentences of an article: front to
      back, section by section. At any point the reader holds exactly what
      came before it, and nothing after it.
  - term: "Item"
    intuition: |
      Anything a sentence can lean on that has to be given somewhere in the
      article: a term, a symbol, a definition, a principle or premise, a
      result, a number, a quotation. An item is introduced at the first place
      where its content is actually supplied — not where it is first named.
  - term: "Dependence"
    intuition: |
      A sentence depends on an item when the reader needs that item's content
      to understand the sentence or to check it — when the item works as a
      step, a value, a premise, or the meaning of a word in the sentence.
  - term: "Object from prior work"
    intuition: |
      Something the article takes from earlier literature and uses as a unit
      of its argument: an estimator or statistic, a method or algorithm, a
      model, a measure or instrument, a data set, or a theorem or named
      result. Its introduction is the first place where its content is
      supplied, as for an item.
  - term: "Forward pointer"
    intuition: |
      A sentence that refers to a place later in the article ("in Section 6",
      "below", "as we will see").
  - term: "Flow"
    intuition: |
      The ordered list of the ideas of an article, in reading order and
      grouped by section: one line for what each stretch of the article
      tells the reader. A flow can be written before the prose and expanded
      into it, or read off prose that exists. An axiom stated on a flow
      holds of an article when it holds of the article's flow.
  - term: "Idea"
    intuition: |
      One entry of a flow: what one stretch of the article (a paragraph, or
      a few sentences) tells the reader. A claim, a definition, a case, an
      example or a step of the argument is an idea. An idea has a position
      in the flow and a topic.
  - term: "Topic"
    intuition: |
      An object that the article introduces and then says things about: an
      item in the sense above (a term, a definition, a principle, a result,
      a number), a method, an estimator, a measure or a data set, or a case
      or a group that the article sets apart. A topic is the object and not
      an aspect of it: the bias and the variance of an estimator are two
      things said about one topic. A flow may label its ideas by topic; the
      labels are an aid, and no axiom takes its verdict from them.
  - term: "Display"
    intuition: |
      A figure or a table.

axioms:
  - id: "A1_no_forward_dependence"
    name: "No forward dependence in any scholarly article"
    one_liner: "Rest only on items already met; a pointer ahead is a roadmap or a promissory note, nothing else."
    generalizes: "mathematical-writing/A4_reading_order_dependence"

    statement_natural: |
      In a scholarly article of any discipline, a sentence may depend only on
      terms, symbols, definitions, principles, results, numbers and
      quotations that the reader has already met. The reader holds only what
      came before: a sentence that leans on something supplied later cannot
      be understood or checked when it is read, and a premise that will be
      stated later looks, at that point, like nothing at all.
      A forward pointer is allowed in exactly two cases. This list is closed:
      no third case may be added because it resembles one of these two.
        (1) Roadmap. The pointer names where a question is treated and
            supplies no content the reader needs at that point. The overview
            paragraph at the end of an introduction is of this kind.
        (2) Promissory note. A claim or an open case is stated now, and it is
            fully intelligible now — every term in it has already been
            defined — while its argument or its resolution is placed later.
      Anything else that points ahead is a forward dependence and a defect,
      including a definition that is written early but whose content lies in
      a later section: naming an item does not introduce it.
      The remedy is to reorder, never to delete. Either move the definition
      or principle to before its first use, or move the dependent sentence
      to after what it depends on, so that it cites backward. Moving text is
      a re-placement, so the set of places that cite the moved passage must
      be known before it moves (mathematical-writing A3_replacement_precondition).
      This axiom generalizes mathematical-writing A4_reading_order_dependence
      from formal mathematics, where the units are definitions, propositions,
      remarks and examples, to the prose of any article, where the unit is
      the sentence and the items include terms, principles and quotations.
      A4's two legitimate forward pointers — the section overview, and the
      pointer from an open case to where it is closed — correspond to (1) and
      (2) here; this axiom states the condition on (2) explicitly and closes
      the list.

    statement_formal: |
      Let the article be the sentences s_1, …, s_N in reading order. For an
      item x let intro(x) be the index of the sentence that first supplies
      its content (naming x without supplying it does not count). Let
      Needs(s_i) be the items whose content is required to understand or
      check s_i.
        Backward dependence:  ∀ i, ∀ x ∈ Needs(s_i):  intro(x) < i
      A forward pointer s_i → s_j with j > i is permitted iff it is of kind
      E1 or E2, and Exceptions = {E1, E2} is closed (no extension by analogy):
        E1 (roadmap):          s_i names the location s_j and
                               Needs(s_i) ∩ Content(s_j) = ∅
        E2 (promissory note):  s_i states a claim or open case c with
                               ∀ x ∈ Needs(c): intro(x) < i,
                               and s_j holds only Argument(c) or Resolution(c)
      Naming is not introducing:  "x denotes …, stated in s_j" with j > i
                               leaves intro(x) = j, not i.
      Remedy — reorder, do not delete:  if x ∈ Needs(s_i) and intro(x) > i,
        either  move the passage introducing x to a position before i,
        or      move s_i to a position after intro(x), citing backward,
      subject to Cites(moved passage) known first
      [mathematical-writing A3_replacement_precondition].
      Relation to the parent: restricted to statements of formal mathematics
      and to Uses ⊆ {step, value, premise}, this is
      mathematical-writing A4_reading_order_dependence; E1 and E2 are A4's
      roadmap pointers (s_j ∉ Uses(s_i)) with E2's condition made explicit.

    rationale: |
      The author holds the whole article and sees a closed argument; the
      reader holds a prefix and sees a sentence resting on something not yet
      given. Outside mathematics the defect is easier to miss, because prose
      lets a forward reference sound like a definition: "L+ denotes these
      assumptions together with the principle of Section 6.3" reads as if it
      fixed what L+ is, while the reader still does not know what the
      principle says. Two kinds of forward pointer survive because they
      transfer nothing the reader needs yet: a roadmap only says where, and a
      promissory note states something already intelligible and postpones
      only its support. The list is closed because an open criterion
      ("pointers that do no harm") lets each new case argue itself into the
      exemption, and the violation below shows how plausible that argument
      can look: a forward definition reads like a definition. The remedy is
      reordering because the dependence is usually real — the later passage
      really is what the sentence needs — so deleting the dependence loses a
      true link, while reordering keeps it and turns it backward.

    violations:
      - description: "A symbol defined in §3.1 through a principle stated only in §6.3, then used in §4.3's central formula"
        content: |
          §3.1: "… where the subscript L signals a Leibnizian metaphysical
          assumption, not a theorem of contemporary logic. Below, L+ denotes
          these assumptions together with the expressive-value principle of
          Section 6.3."
          §4.3: "Second, the significance can be present without uptake. On
          the Leibnizian assumptions together with the expressive-value
          principle (L+, Section 3.1),
            ◇_{L+} ∃p [P_T(p, φ) ∧ M_T(φ) ∧ X(p, φ) ∧ …]"
          The principle itself is first stated in §6.3.
        explanation: |
          §3.1 looks like a definition but supplies no content: it names the
          principle and points ahead to where the principle is stated, so
          intro(L+) is §6.3, not §3.1. §4.3 then uses L+ and the principle
          in the possibility formula that carries the strong thesis. A reader
          at §3.1 or at §4.3 cannot know what the principle says, so cannot
          tell what the formula claims. Neither exception applies: the
          pointer supplies content the reader needs now (not a roadmap), and
          the claim in §4.3 is not intelligible now (not a promissory note).
          (Leibniz machine-proof manuscript for Synthese, 2026-10-10,
          commit 543f22b.)
      - description: "The announcement of a later worked example is made to carry a definition (added 2026-11-26)"
        content: |
          §2: "Section 5 works a complete example on one data set. We call a
          sample balanced when its groups are like those of that example."
          §3: "For balanced samples the two estimators agree to the first
          order."
          §5: the example, with five groups of twelve observations each.
        explanation: |
          The first sentence of §2 is a roadmap and would be allowed. The
          second makes the pointer supply content: what "balanced" means
          lies in §5, so intro(balanced) is §5 and not §2, and the result in
          §3 cannot be understood or checked when it is read. Exception (1)
          fails because the pointer supplies content the reader needs at
          that point, and exception (2) fails because the claim in §3 is not
          intelligible where it stands. That the later passage is a complete
          example does not make a third exception. The remedy is to state
          the condition in §2 ("balanced: all groups have the same size")
          and to keep the announcement. (Constructed for this axiom; not
          taken from a manuscript.)

    compliant:
      - description: "The principle stated where it is first needed; the forward definition deleted; the later section refers back"
        content: |
          §4.3: "Second, the significance can be present without uptake. This
          part needs a further premise, beyond the Leibnizian assumptions of
          Section 3.1. I state it here and defend it in Section 6.3:
            Expressive-value principle. Within a Leibnizian teleology, the
            actual embodiment of a genuine, rationally accessible
            demonstrative order may possess objective value as an expression
            of an intelligible order ultimately grounded in divine wisdom,
            whether or not its meaning is ever realized in the cognition of
            finite rational spirits.
          Let L+ denote the Leibnizian assumptions together with this
          principle. On L+, ◇_{L+} ∃p [ … ]"
          §3.1: the sentence defining L+ is removed.
          §6.3: "The answer requires the expressive-value principle stated in
          Section 4.3, which is not itself a theorem of logic."
        explanation: |
          The principle is now introduced, in full, before the first sentence
          that needs it, and L+ is defined at the same place, so every
          dependence points backward and §6.3 cites back to §4.3. The pointer
          "defend it in Section 6.3" remains and is exception (2): the
          principle is fully stated and intelligible in §4.3; only its defence
          lies ahead. The fix reordered rather than deleted: the principle
          and its defence are both still in the article. (Same manuscript,
          commit a0f987a.)
      - description: "A complete worked example given later is announced earlier, and nothing is taken from it (added 2026-11-26)"
        content: |
          §2: "The two estimators are defined for any grouped sample.
          Section 5 works one data set through both of them, from the raw
          observations to the two standard errors."
          §3 and §4: the properties of the two estimators, stated and
          derived in general. No sentence uses a group size, a value or a
          step from Section 5.
          §5: the worked example.
        explanation: |
          The announcement is exception (1), the roadmap. It names where the
          question "what does this look like on data?" is treated and
          supplies no content, so Needs(s_i) ∩ Content(s_j) = ∅, and every
          sentence of §2 to §4 can be understood and checked without §5.
          This is an instance of an existing exception and adds none: the
          list of two stays closed. An earlier sentence that goes further
          and states a claim whose only support is the example is judged
          under exception (2), on whether the claim is intelligible where
          it stands. (Constructed for this axiom; not taken from a
          manuscript.)

  - id: "A2_motivated_by_prefix"
    name: "Each element of a scholarly article is called for by what precedes it"
    one_liner: "An article is read in order, not checked item by item: an example, a definition, a finding or a quotation arrives only after the reader holds the question it answers."
    generalizes: "mathematical-writing/A5_motivated_by_prefix"

    statement_natural: |
      In a scholarly article of any discipline, being right sentence by
      sentence is not enough: each element must also be called for by what the
      reader has already read. When the reader reaches a concrete example or
      case, a definition, a figure or table, a finding, or a quotation, the
      preceding text must already have raised the question it answers or the
      need it meets. An element that arrives before its question breaks the
      flow even when it is accurate and depends on nothing later: the reader
      has to hold it without knowing what it is for, and to work out
      afterwards why it was there. The commonest case is a vivid case or a
      worked example placed first to catch interest: it answers "does this
      matter?" or "what does this look like?", and that question has to be
      asked before the case can answer it. The remedy is to reorder, or to
      write the transition that raises the question: state the debate, the
      claim, the gap or the choice, then bring the element in as the answer,
      saying in the sentence that introduces it which question it answers. A1
      governs what a sentence may lean on; this axiom governs when an element
      may appear. An element can satisfy either one and still violate the
      other.

    statement_formal: |
      Let S_1, …, S_N be the article in reading order, let E ⊆ {1, …, N} be
      the positions of its elements (examples and cases, definitions and
      notations, figures and tables, findings and results, a theorem
      included, and quotations; a sentence that raises a question, a
      transition or a statement of the setting is not an element), and for
      i ∈ E let Q(S_i) be the question or need S_i answers: for an example or case, the claim it
      illustrates or the doubt it settles; for a definition, the term the
      argument is about to need; for a figure, table or finding, the question
      it settles; for a quotation, the claim it supports or the view it
      represents.
        Motivated:   ∀ i ∈ E,  ∃ j < i  such that S_j raises Q(S_i)
        Announced:   ∀ i ∈ E,  S_i itself, or the sentence just before it in
                     the same paragraph, names Q(S_i); or S_i immediately
                     follows the S_j that raises it.
      Independence from A1:
        A1 constrains what S_i depends on;  A2 constrains Q(S_i), the purpose
        S_i serves. Either can hold while the other fails.
      Remedy — reorder or write the transition, do not delete:
        if no j < i raises Q(S_i), then
        either  move S_i after the S_j that raises Q(S_i),
        or      insert before S_i a sentence that raises Q(S_i).

    rationale: |
      The writer knows why each element is there, so an element that comes
      too early looks fine to the writer: it is accurate, it depends on nothing
      later (A1 passes), and its purpose becomes clear a page later. The
      reader, who holds only what came before, meets it without its purpose.
      Checks that look at one sentence at a time (is it true, is it cited, does
      it lean on later material) cannot see the defect, because the defect is
      a property of the sequence. The principle is not specific to formal
      mathematics: an empirical article that opens on a participant's story,
      or a philosophy paper that opens on a thought experiment, has the same
      problem when the question the story or the experiment answers is raised
      only afterwards. It generalizes mathematical-writing's A5, as A1
      generalizes that domain's A4. The remedy is reordering or a transition
      rather than deletion, because the element is usually worth having.

    violations:
      - description: "An empirical article opens on a result before the reader knows what question it settles"
        content: |
          ¶1. Sleep and memory have been studied for more than a century.
          ¶2. In our sample of 120 students, sleep after learning a word list
          improved recall a day later by 18 percentage points for lists
          learned in the morning and by 17 for lists learned in the evening.
          ¶3. Two accounts of this kind of effect compete …
        explanation: |
          ¶2 reports a finding before the reader knows that there is a
          question it settles. The competing accounts, and so the reason the
          morning and evening lists are compared, arrive only in ¶3, so the
          reader cannot tell on first reading which part of the result is the
          point.
          The numbers may be right and nothing depends on later material: A1 is
          satisfied and the opening still breaks the flow. (The example is
          constructed for this axiom; it is not taken from a manuscript.)

    compliant:
      - description: "The open question comes first; the result arrives as its answer"
        content: |
          ¶1. Sleep after learning improves later recall, but two accounts of
          why compete. If sleep mainly shields new memories from the
          interference of waking activity, its benefit should be larger for
          lists learned in the evening, which go straight to sleep, than for
          lists learned in the morning, which meet a day of waking activity
          first; if sleep replays and strengthens new memories, the benefit
          should not depend on when the list was learned.
          ¶2. Comparing morning and evening lists therefore tells the accounts
          apart, provided the comparison can detect the evening advantage of
          about 10 percentage points that the shielding account predicts. In
          our sample of 120 students, sleep improved recall a day later by 18
          percentage points for lists learned in the morning and by 17 for
          lists learned in the evening: a difference of 1 point (95% CI −4 to
          6), well short of that advantage.
        explanation: |
          ¶1 raises the question (which account?) and says what would settle
          it. ¶2 opens with the sentence that names how its finding settles the
          question and then gives the finding. The finding is the same; only its
          position and its first sentence change.

  - id: "A3_literature_at_introduction"
    name: "Each object is introduced with its own literature; the broad review comes later"
    one_liner: "Where an object from prior work first appears, one or two sentences give its source and the property the article relies on; the wider review goes in a later section of its own."

    statement_natural: |
      In a scholarly article of any discipline, the place where an object
      from prior work is first introduced also gives one or two sentences of
      its literature: where the object comes from, and the property of it
      that the article relies on or that the reader needs in order to judge
      it. For an estimator that property is often its large-sample behaviour.
      An important property is stated at this first mention, not held back to
      a later section. The broad review — the wider history, the
      alternatives, the debates and the comparison with related work — goes
      in a section of its own, placed after the objects it discusses have been
      introduced (a related-work section or the discussion).
      "Object from prior work" is a closed list: an estimator or statistic, a
      method or algorithm, a model, a measure or instrument, a data set, a
      theorem or named result. Two exemptions, also closed (no third may be
      added because it resembles one of these):
        (1) an object the article itself defines for the first time, which
            has no prior literature; its definition is enough;
        (2) a basic concept taught in undergraduate courses and used in its
            standard meaning (a mean, a variance, a likelihood).
      The one or two sentences are claims about the literature, so each must
      say what the cited passage states. If the source states the property in
      other terms, the sentence uses the source's terms; a further step drawn
      from it is either cited to a source that states it or marked as the
      article's own.
      A2 governs when an element may appear; this axiom governs where the
      literature of an object goes. An object can be called for by what
      precedes it and still arrive without its literature, and the reverse.

    statement_formal: |
      Let O be the objects from prior work used in the article, excluding the
      closed set Exempt = {self-defined, undergraduate-standard}. For o ∈ O
      let intro(o) be the sentence that first supplies its content (as in
      A1), Source(o) its origin in the literature, and Key(o) the property of
      o the article relies on.
        Attached:   ∀ o ∈ O, one or two sentences adjacent to intro(o), in the
                    same paragraph, state Source(o) and Key(o) with citations.
        Key first:  the first sentence of the article that states Key(o) is
                    one of these attached sentences.
        Review apart: a sentence about o's literature beyond Source(o) and
                    Key(o) (history, alternatives, debate, comparison) lies in
                    a dedicated section R, and every object R discusses is
                    introduced before R begins.
        Faithful:   each attached sentence attributes to a cited passage only
                    what that passage states; a further step has its own
                    citation or is marked as the article's own.
      Independence from A2:
        A2 constrains when an element appears (after its question); A3
        constrains where an object's literature appears (with the object).
        Either can hold while the other fails.
      Remedy — move, do not delete:
        if Source(o) or Key(o) is first stated outside the attached sentences,
        move those sentences to intro(o), leaving the wider review in R.

    rationale: |
      A reader meets an object at its introduction and judges it there: what
      it is, where it comes from, and why it can be trusted for the role the
      argument gives it. If the source and the key property arrive only in a
      review section several pages later, the reader carries the object
      without its credentials, and a property the argument relies on early
      looks unsupported when it is first used. The reverse failure is a
      review placed before the objects: the reader reads a history of things
      not yet introduced, which strains A2. One or two sentences at the point
      of introduction give the reader what is needed to follow the argument,
      and the dedicated section keeps the wider review from interrupting the
      argument's order. The faithfulness condition is part of the axiom
      because a short sentence about a source invites paraphrase: compressing
      what a paper showed into a standard property can attribute to its
      author a word the author did not use.

    violations:
      - description: "An estimator introduced without its source; its key property first appears in a related-work section"
        content: |
          §2. The information-based standard error of an ability estimate is
          1/sqrt(I(θ-hat)), where I is the test information function.
          §3–§6 use it throughout.
          §7, Related work. Lord (1983, p. 234), applying the theorems of
          Bradley and Gart (1962), showed that the maximum likelihood estimator
          is consistent and asymptotically normal with variance 1/I(θ) …
        explanation: |
          The property that explains why 1/sqrt(I(θ-hat)) is reported as the
          standard error at all is the one Lord's result supplies, and the
          reader meets it only in §7, after the comparison it underlies. At §2
          the formula has no source and no reason. Nothing here is a forward
          dependence in A1's sense, since no sentence of §2 leans on §7, and
          the definition may well be called for by what precedes it (A2), so
          the defect is this axiom's alone. (The example is constructed for
          this axiom; it is not quoted from a manuscript.)

    compliant:
      - description: "The source and the key property attached at the introduction; the wider review kept for a later section"
        content: |
          §2. The information-based standard error of an ability estimate is
          1/sqrt(I(θ-hat)), where I is the test information function. Lord
          (1983, p. 234), applying the theorems of Bradley and Gart (1962),
          showed that the maximum likelihood estimator is consistent and
          asymptotically normal with variance 1/I(θ); this is why
          1/sqrt(I(θ-hat)) is reported as its standard error.
          §7, Related work: corrections to the information formula, Monte
          Carlo studies of short tests, and other estimators of the standard
          error.
        explanation: |
          The source and the property arrive with the formula, in two
          sentences, and the wider literature stays in §7. The second sentence
          says what Lord's page states — consistency and asymptotic normality
          with variance 1/I(θ) — and not that the estimator is "efficient",
          a word that page does not use; an article that wants that word adds
          a citation for it or marks it as its own step. (Constructed for this
          axiom, like the violation.)

  - id: "A4_own_results_after_question"
    name: "In the Introduction, the article's own results come after the research question"
    one_liner: "Before the Introduction states the research question it gives what is known, the setting and the gap; what the article itself establishes comes after the question."

    statement_natural: |
      In a scholarly article whose Introduction states a research question
      (an aim or a hypothesis counts as one), the sentences of the
      Introduction that come before that statement give only three kinds of
      thing: what is already known, with its citations; the definitions,
      notation and setting the question needs; and what is not known, the
      gap. A result of the article itself appears in the Introduction only
      after the question has been stated.
      "Own result" is a statement that the article proves, computes or finds
      and that bears on the answer to its question. It includes a statement
      that says or implies which way the answer goes (which of the compared
      things is better, the sign or the size of an effect, that a conjecture
      holds), and it includes a result that changes how the question is
      posed (for example, that two of the procedures to be compared are the
      same one). A result of the second kind does not go before the
      question: the question is asked in a form that does not use it, and
      the result follows directly after.
      Two things are not own results for this axiom. The list is closed (no
      third may be added because it resembles one of these):
        (1) an illustration of the setting: a value obtained directly from
            definitions already given and stated without saying which way
            the answer goes ("the two reported values are 0.41 and 0.47");
            once the sentence adds a direction ("the first is the more
            accurate"), it is an own result;
        (2) a roadmap pointer in the sense of A1, which says where something
            is treated and gives no content.
      The axiom is conditional on the Introduction stating a question. The
      abstract is not part of the Introduction and states results first. An
      article written to the convention in which the opening paragraph
      states the main theorem (common in mathematics) has no question
      sentence before that statement, and this axiom places no constraint on
      it; an article follows one of the two conventions throughout and does
      not mix them.
      A1 governs what a sentence may depend on and A2 whether an element is
      called for by what precedes it. A result placed before the question
      can satisfy both: its terms are defined, and the sentence before it
      leads to it. This axiom governs one order that those two do not see.

    statement_formal: |
      Let q be the first sentence of the Introduction that states the
      research question. Let Own be the sentences of the Introduction that
      state a result established by the article and bearing on the answer to
      q, excluding the closed set Exempt = {illustration without direction,
      roadmap pointer}.
        Order:      ∀ s ∈ Own, pos(s) > pos(q).
        Before q:   every sentence s with pos(s) < pos(q) is one of
                    {known and cited, definition or setting, gap, Exempt}.
        Reposing:   if r ∈ Own changes the form of the question, q is stated
                    without r and r is the next statement after q.
        Vacuous:    if the Introduction has no q, Order constrains nothing.
      Independence from A1 and A2:
        s ∈ Own with pos(s) < pos(q) can have every item it depends on
        introduced before it (A1 holds) and can answer a question raised by
        the sentence before it (A2 holds); Order still fails.
      Remedy — move, do not delete:
        move s to a position after q; where s stood, state what is known or
        what is open, or nothing.

    rationale: |
      An answer needs its question. Before the question, a reader is
      collecting background, and a statement met there is filed as something
      known; it is not weighed as a claim. When it turns out later to be the
      article's own result, the reader has to go back and reclassify it, and
      a referee cannot tell at each sentence of the opening whose claim is
      being read. A result stated before the question also has nothing yet
      to answer, so the reader cannot judge what it settles. Placed after
      the question, the same sentence is read as what the article adds. The
      illustration is exempt because it shows the reader the situation the
      question is about and takes no side; the moment it takes one, it has
      begun to answer. The convention of stating the main theorem first is
      left alone because there the statement of the theorem does the work of
      the question, and the reader is told so by the form of the article.

    violations:
      - description: "A result that the article proves is the claim of the Introduction's second paragraph, before the question"
        content: |
          ¶1. Why the score of the scale matters in practice.
          ¶2. Three scoring rules are in use: A, B and C (with their
          sources). Rules B and C always give the same score
          (Proposition 1), so only two rules need to be compared.
          ¶3. What is not known about rule A on short forms.
          ¶4. This article asks which scoring rule predicts the criterion
          best on a form of a given length.
        explanation: |
          "Rules B and C always give the same score" is proved in the
          article, and it stands in ¶2 among the things already known. The
          reader files it with the cited background. Every term in it is
          defined, so A1 holds, and the list of three rules does lead to it,
          so A2 holds. (Constructed for this axiom; not quoted from a
          manuscript.)
      - description: "An illustration that says which way the answer goes, before the question"
        content: |
          ¶2. On a 12-item form a respondent answers 8 items in the keyed
          direction. Rule A gives 0.41 and rule B gives 0.47; rule A is the
          more accurate of the two here.
          ¶4. This article asks which scoring rule is the more accurate on a
          form of a given length.
        explanation: |
          The two values show the setting and would be exempt. The clause
          after the semicolon gives part of the answer to a question the
          reader meets two paragraphs later. (Constructed for this axiom.)

    compliant:
      - description: "The same material with the article's results after the question"
        content: |
          ¶1. Why the score of the scale matters in practice.
          ¶2. Three scoring rules are in use: A, B and C (with their
          sources). On a 12-item form with 8 items answered in the keyed
          direction, rule A gives 0.41 and rule B gives 0.47.
          ¶3. What is not known about rule A on short forms.
          ¶4. This article asks which of these scoring rules predicts the
          criterion best on a form of a given length. Rules B and C always
          give the same score (Proposition 1), so two rules are compared.
          ¶5. What the article finds.
        explanation: |
          Before the question the reader meets what is known, the setting
          with an illustration that takes no side, and the gap. The question
          is asked of the three rules, and the result that reduces them to
          two follows it directly. (Constructed for this axiom, like the
          violations.)

  - id: "A5_case_frame"
    name: "A discussion by cases has a frame: announced, in order, exhaustive"
    one_liner: "Before the first case, the text names the question, the scope, the cases and their order; the cases are then discussed in that order, each once; together they cover the scope, which is the range the question was raised with and not one the announcement chooses."

    statement_natural: |
      A discussion by cases is a stretch of consecutive ideas in which one
      question is answered separately under two or more conditions, each
      with a discussion of its own. The stretch runs from its announcement
      to the last case discussed there. It has a frame, and three things
      hold of it.
        (1) Announced. Before the content of the first case, the text names
            the question, the scope, every case, and the order in which
            the cases are taken. The announcement may stand in the idea
            that opens the first case, ahead of what that idea says about
            the case.
            The announcement does not set the scope. The scope is the
            range of situations about which the question was asked where
            the text first raised it. When the announcement is itself the
            first place that raises the question, the scope is the range
            of the question it divides, as last stated before it: the
            question of the section, or the research question of the
            article. The announcement repeats this range.
        (2) In order. The cases are discussed in the announced order. Each
            case is discussed once, in one unbroken run of ideas. One exit
            exists: a part of a case may be deferred as an announced
            continuation in the sense of A6 (2), when the run says which
            part remains and where it is treated. A second split, by
            another condition, starts after the first is finished or
            inside one of its cases, and has a frame of its own.
        (3) Exhaustive. Every situation in the scope falls under a listed
            case. A listed case that is not discussed at its turn has one
            of two dispositions, and this list is closed: deferred, with
            the place where it is discussed (a forward pointer in the
            sense of A1); or excluded, with the reason the article leaves
            it out. An announcement that states a smaller range than the
            scope has excluded the difference and owes the reason, like
            any other exclusion.
      A situation in the scope that no listed case covers is a defect even
      when every discussed case is correct. So is a case that is discussed
      without having been listed.
      One case in a stretch is not a discussion by cases, and no frame is
      required there. When a stretch discusses a single case and the
      article discusses another case of the same question elsewhere, the
      idea that discusses the one case names the other with its place, as
      A6 (2) and A1 require, and that sentence may stand anywhere in the
      idea. "One case discussed here and one deferred" and "a result
      stated under a condition, with a pointer for the situation left out"
      are the same thing, and both fall under this paragraph. The frame is
      required from two cases discussed in one stretch on.
      The remedy is to write the frame and then to reorder: write the
      announcement, bring the ideas of each case together, and put the
      cases in the announced order, by the operations of A8. When the cases
      turn out not to cover the scope, a case is added, or the situations
      not covered are listed as excluded, each with its reason.

    statement_formal: |
      Let q be a question and D a stretch of consecutive ideas that answers
      q under conditions C_1, …, C_k with k ≥ 2, each C_i having ideas of
      its own, Ideas(C_i) ⊆ D. D runs from the announcement a to the last
      idea of the last case discussed there.
        Scope:       let r be the idea that first raises q. If r ≠ a,
                     Scope(q) is the range of situations r asks q about.
                     If r = a, Scope(q) is the range of the question that q
                     divides, as last stated before a. The range that a
                     states plays no part in fixing Scope(q).
        Announced:   a states q, Scope(q), a list L = (C_1, …, C_m) with
                     m ≥ k, and the order of L, and a precedes the content
                     of every Ideas(C_i); a may be the first part of the
                     idea that opens the first case.
        In order:    for discussed cases C_i before C_j in L:
                     max pos(Ideas(C_i)) < min pos(Ideas(C_j)),
                     and each Ideas(C_i) occupies consecutive positions,
                     except a part deferred with Announced(C_i, part) as
                     in A6.
        Listed:      every case discussed in D is in L.
        Exhaustive:  Scope(q) ⊆ C_1 ∪ … ∪ C_m, and every C_i in L is
                     discussed in D, or Deferred(C_i, place), or
                     Excluded(C_i, reason).
                     Dispositions = {discussed, deferred, excluded} is
                     closed. If a states a range R ⊊ Scope(q), then
                     Scope(q) ∖ R is a case with Excluded(·, reason).
      Not a discussion by cases:  k = 1. A case of q discussed elsewhere is
        named, with its place, by the idea that discusses the one case;
        this is judged under A6 (2) and A1.
      Remedy:  write a; then apply A8 until In order holds; if
        Scope(q) ⊄ C_1 ∪ … ∪ C_m, add a case to L, or list the uncovered
        situations as excluded, with the reason.

    rationale: |
      A reader inside an unframed case discussion does not know how many
      cases are coming, whether the case being read is the last one, or
      whether the situation they have in mind will be treated at all. Every
      case can be correct and the reader still cannot see what the cases
      add up to. The writer does not notice, because the writer holds the
      whole division in mind before writing the first case. An unannounced
      case reads as a digression, and a case discussed in two places makes
      the reader go back to what they had taken as finished. Exhaustiveness
      needs a scope that the announcement cannot choose. If the
      announcement set its own scope, any list of cases would be complete
      by definition: a group that the writer forgot could be made to
      disappear by announcing the range without it. So the scope is read
      from the place where the question was asked, and a smaller range in
      the announcement is an exclusion that has to give its reason. The
      dispositions are a closed list because a case that is silently
      missing and a case that is left out on purpose look the same to the
      reader unless the text says which it is.

    violations:
      - description: "The cases arrive one at a time, with no announcement"
        content: |
          Earlier in the article: the research question asks whether the
          worked-example lessons raise the end-of-term score of the
          students of the sample, all of whom took an earlier test.
          Idea 1. Among students in the lowest third on the earlier test,
          the lessons raised the end-of-term score.
          Idea 2. Among students in the highest third they made no
          difference.
          Idea 3. Among students in the middle third the gain was about
          half that of the lowest third.
        explanation: |
          Condition (1) fails, and with it the formal clause Listed, since
          there is no list for the cases to be on. At idea 2 the reader does
          not know whether a middle group exists, or whether idea 2 ends the
          comparison, and learns only at the end that the three thirds were
          the plan. Conditions (2) and (3) are not at fault: with an
          announcement that lists the cases in the order lowest, highest,
          middle, the same three ideas would meet both. (Constructed for
          this axiom; not taken from a manuscript.)
      - description: "Announced and exhaustive, but discussed out of order and one case in two places"
        content: |
          Earlier in the article: the same research question, about the
          students of the sample, all of whom took the earlier test.
          Idea 1. The effect is reported by prior score for the students of
          the sample, in three groups of equal size, as in the earlier
          studies of these lessons: the lowest third, the middle third and
          the highest third, in that order.
          Idea 2. Lowest third: the lessons raised the score.
          Idea 3. Highest third: no difference.
          Idea 4. Lowest third again: the gain was still present one term
          later.
          Idea 5. Middle third: about half the gain of the lowest third.
        explanation: |
          Condition (2) fails twice. The highest third is taken before the
          middle third, against the announced order, and the lowest third
          is discussed in two runs (ideas 2 and 4), with nothing in idea 2
          to say that a part remained. The announcement and the coverage
          are in order: the three thirds contain every student in the
          scope. (Constructed for this axiom.)
      - description: "Announced and in order, but the cases do not cover the scope, whatever range the announcement states"
        content: |
          Earlier in the article: the same research question, about the
          students of the sample.
          Version 1 of idea 1. The effect is reported for the students of
          the sample, in two groups: students below the 25th percentile of
          the earlier test, then students above the 75th.
          Version 2 of idea 1. The effect is reported for the students below
          the 25th percentile of the earlier test and for those above the
          75th, in that order.
          Idea 2. Below the 25th percentile: the lessons raised the score.
          Idea 3. Above the 75th percentile: no difference.
        explanation: |
          Condition (3) fails in both versions. The scope is fixed by the
          research question, the students of the sample, and the half of
          them between the two percentiles falls under no listed case. In
          version 2 the announcement states a smaller range and gives no
          reason, so it has excluded the middle half without the reason
          that an exclusion owes: narrowing the announced range does not
          make the cases complete. Either a case is added, or the
          announcement lists the middle half as excluded and says why.
          (Constructed for this axiom.)

    compliant:
      - description: "The frame first, the cases in the announced order, the left-out group listed as excluded, and a second split with a frame of its own"
        content: |
          Earlier in the article: the research question asks whether the
          lessons raise the end-of-term score of the students of the
          sample.
          Idea 1. The effect is reported by prior score for the students of
          the sample. Students who took the earlier test are taken in three
          groups of equal size, as in the earlier studies of these lessons,
          in this order: the lowest third, the middle third, the highest
          third. Students who missed the earlier test (4% of the sample)
          have no prior score and are left out of this comparison.
          Idea 2. Lowest third: the lessons raised the score, and the gain
          was still present one term later.
          Idea 3. Middle third: about half the gain of the lowest third.
          Idea 4. Highest third: no difference.
          Idea 5. Class size is examined next, as a second division of the
          same sample: classes of 20 or fewer, then classes of more than
          20, the median class size of the sample being 20. Every class is
          one or the other.
          Idea 6. Classes of 20 or fewer.
          Idea 7. Classes of more than 20.
        explanation: |
          Idea 1 names the question (the effect by prior score), repeats
          the scope that the research question set (the students of the
          sample), gives the cases and their order, and lists the students
          with no prior score as excluded, with the reason. Ideas 2 to 4
          follow the announced order and each case has one run; what the
          second violation said in two places about the lowest third now
          stands together in idea 2. The second split starts after the
          first is finished and has its own announcement (idea 5), whose
          two cases cover every class. The two choices of a division (three
          equal groups, the cut at 20) carry their reasons, as A7 (c)
          asks. (Constructed for this axiom, like the violations.)

  - id: "A6_topic_once"
    name: "Each topic is treated in one place"
    one_liner: "What the body asserts about a topic stands together: a later assertion about it that depends on nothing introduced since is a return. A backward reference that leaves the earlier assertions as they were, an announced continuation and the framing sections are not returns."

    statement_natural: |
      In the body of an article each topic is treated once: what is
      asserted about it stands together, and once the flow has moved on,
      it does not come back to say more about it. A return makes the
      reader reopen something they had taken as settled, and what they
      read in between was read without the part that came late.
      Terms. A topic is an object that the article introduces, not an
      aspect of one. An idea treats a topic when it asserts something
      about it that can be right or wrong: a property, a result, a case, a
      qualification, an explanation. Introducing the topic (defining it,
      fixing its notation, describing a method, a measure or a data set)
      is not treating it. An idea can treat more than one topic: a
      comparison treats both things compared. The run on a topic is the
      unbroken sequence of ideas that treat it, starting at the first idea
      that does. The flow leaves the topic at the first idea after the run
      that does not treat it.
      The test. Let a later idea assert something about a topic that the
      flow has left. Two questions are asked of the assertion, in this
      order. Neither depends on how the flow labels its ideas.
        Step 1. Does the assertion depend, in the sense of A1, on an item
            introduced after the flow left the topic (a later definition,
            result, number or data set)? If it does not, it could have
            stood in the run, and the idea is a return.
        Step 2. If it does, does it amend the run? An assertion amends the
            run when it restricts, corrects or qualifies something the run
            asserted, or adds a case or a condition to it; this list of
            five is closed. If it amends the run, it is a late part of the
            treatment and needs the announcement of (2) below. If it does
            not, it is a backward reference, (1) below.
      Three things are not a return. The list is closed: any other
      assertion about a topic after the flow has left it is a defect,
      however small.
        (1) Backward reference. The later assertion depends on an item
            introduced after the flow left the topic, and it leaves what
            the run asserted as it was. It uses the earlier result as a
            step or a value, or says how a later topic stands to the
            earlier one (a comparison, an instance, a consequence), or
            states a further property that needed the later item. This is
            the backward dependence that A1 asks for.
        (2) Announced continuation. At the end of the run on the topic,
            before the flow turns to anything else, the text says which
            part remains and where it is treated, and the later place
            treats that part and nothing else of the topic. The pointer is
            one of the two forward pointers of A1. Of this kind are: a
            claim stated in one section and defended in a later one; a
            case deferred in the frame of A5; a case named with its place
            by the idea that discusses another case; a second split
            announced when the first is finished; and an appendix item
            that its home idea points to (A9). Each part is still treated
            once.
        (3) Framing sections. The abstract, the Introduction, the section
            that holds the broad review of A3, and the closing section (a
            discussion or a conclusion) may take up a topic of the body in
            three ways: to state in advance what the body establishes, to
            place it in the literature, and to interpret it. The list of
            four positions and the list of three ways are both closed. A
            framing section adds no result of the article's own about a
            topic of the body that the body does not state. "Own result"
            is meant as in A4: something the article proves, computes or
            finds. The order inside the Introduction is governed by A4.
      Examples. An example placed inside the run on a topic is part of
      that run. A complete worked example in a section of its own, whether
      or not it was announced earlier under exception (1) of A1, treats a
      topic of its own, the data set or the instance it works on, which is
      introduced there. Its assertions depend on that item, so they pass
      Step 1, and they are backward references unless they amend an
      earlier assertion. The announcement of such an example asserts
      nothing about it and is not a treatment.
      The remedy is to bring the assertions together, not to delete the
      late one. A return moves into the run and is merged there (A8). A
      late part that cannot move, because it depends on material in
      between, is announced at the end of the run: the run says what
      remains and where.

    statement_formal: |
      Let d_1, …, d_M be the ideas of the flow in reading order. For a
      topic t let Treats(d, t) hold when d asserts something about t;
      introducing t does not count. Let Run(t) = {d_a, …, d_b} be the
      consecutive ideas with Treats(·, t) that begin at the first such
      idea, and leave(t) = b + 1. Let P = {abstract, Introduction, review
      section, closing section} be the framing positions (closed), and B
      the ideas outside P.
      For an idea d_k ∈ B with k > b that makes an assertion c about t:
        Late(c)      ⇔  ∃ x ∈ Needs(c):  intro(x) ≥ leave(t)
        Amends(c)    ⇔  c restricts, corrects or qualifies an assertion of
                        Run(t), or adds a case or a condition to one
                        (closed list of five).
        Announced(t, c)  ⇔  an idea of Run(t), or the idea d_{leave(t)},
                        states which part of t remains and names the place
                        of d_k, and c belongs to that part.
        Return:              ¬Late(c) ∧ ¬Announced(t, c)               defect
        Unannounced part:    Late(c) ∧ Amends(c) ∧ ¬Announced(t, c)    defect
        Backward reference:  Late(c) ∧ ¬Amends(c)                      allowed
        Announced continuation:  Announced(t, c)                       allowed
      Framing:  for d ∈ P, an assertion about t is allowed iff it states in
        advance what an idea of B establishes, places t in the literature,
        or interprets t, and it is not an own result (A4) about t that no
        idea of B states.
      Exceptions = {backward reference, announced continuation, framing
      sections} is closed.
      Labels:  the verdict on c is a function of Needs(c), intro, Run(t)
        and the assertions of Run(t). The topic labels of a flow help to
        find Run(t); they do not enter the verdict, and the test is made
        for every topic that c is about.
      Remedy — bring together, do not delete:
        Return:            move d_k into Run(t) and merge (A8).
        Unannounced part:  add to the last idea of Run(t) what remains and
                           where, so that Announced(t, c) holds.

    rationale: |
      A reader who has finished the part of an article on a topic files
      what it said and reads on with that in hand. A later addition to the
      same topic changes what was filed, and everything read in between was
      read with the earlier, incomplete version. The writer returns to a
      topic for reasons that have nothing to do with the reader: the
      qualification was found late, or a referee asked for it, or the
      second result needed the first to be amended. Each such addition is
      correct where it stands, so no check of single sentences finds it.
      The test is made on what the later assertion depends on, and not on
      labels, because a label can be chosen to fit: a late qualification of
      the bias of an estimator can be labelled "the effect of unequal
      groups" and made to look like a new topic. What cannot be chosen is
      whether the sentence needed anything that came after the run. If it
      did not, it belonged in the run. If it did, the remaining question is
      whether the reader must now revise what the run said, and then the
      run should have told them that more was coming.
      The three exceptions are the cases in which the reader is not asked
      to reopen anything. A backward reference uses the earlier topic
      without changing it. An announced continuation told the reader, at
      the time, that the topic was not finished. The framing sections are
      read as previews, reviews and interpretations of the body; a new
      result placed there is a return like any other, which is why the
      exception stops at results. The list is closed because "a small
      addition does no harm" is the argument every return makes for
      itself.

    violations:
      - description: "A qualification of an earlier result appears two topics later"
        content: |
          §3, idea 1. Bias of estimator A: of order 1/n, and negative.
          §3, idea 2. Variance of estimator A.
          §4, idea 3. Bias of estimator B.
          §4, idea 4. Variance of estimator B.
          §4, idea 5. When the groups have unequal sizes, the bias of A can
          have either sign.
          §5, idea 6. The two estimators compared by mean squared error.
        explanation: |
          The run on estimator A is ideas 1 and 2, and the flow leaves A at
          idea 3. Idea 5 asserts something about A and depends on nothing
          introduced since idea 3: group sizes belong to the design, which
          was there from the start. By Step 1 it is a return, whatever
          label the flow gives it, "the bias of A" or "the effect of unequal
          groups". Idea 2 did not announce that a part remained, and §4 is
          not a framing section. The reader took "negative" from idea 1 and
          read ideas 2 to 4 with it. Idea 6 is not a return: it depends on
          the bias and the variance of B, introduced after the flow left A,
          and it amends nothing said about A. Moving idea 5 to the
          Discussion does not help: it is a result of the article's own
          that the body would then not state. (Constructed for this axiom;
          not taken from a manuscript.)

    compliant:
      - description: "The late idea is merged into the run; the later section only cites it"
        content: |
          §3, idea 1. Bias of estimator A: of order 1/n; negative when the
          groups have equal sizes, of either sign when they do not.
          §3, idea 2. Variance of estimator A.
          §4, idea 3. Bias of estimator B: of order 1/n as well, and
          smaller in absolute value than the bias of A found in Section 3.
          §4, idea 4. Variance of estimator B.
          §5, idea 5. The two estimators compared by mean squared error.
        explanation: |
          Everything that could be said about the bias of A when the flow
          was on A is in idea 1. Idea 3 does assert something about A, the
          comparison of the two biases. It depends on the bias of B, a
          result introduced after the flow left A (Step 1), and it leaves
          idea 1 as it was (Step 2), so it is a backward reference. The
          same holds of idea 5. No claim of the violation was deleted.
          (Constructed for this axiom.)
      - description: "The part that cannot move is announced at the end of the run"
        content: |
          §3, idea 1. Bias of estimator A for groups of equal size: of
          order 1/n, and negative.
          §3, idea 2. Variance of estimator A for groups of equal size. For
          groups of unequal size the bias and the variance need the weights
          defined in Section 4.2 and are treated there.
          §4.1, idea 3. Bias and variance of estimator B.
          §4.2, idea 4. The weights for groups of unequal size.
          §4.2, idea 5. Bias and variance of estimator A for groups of
          unequal size: the bias can have either sign.
        explanation: |
          Idea 5 depends on the weights of idea 4 (Step 1), and it adds a
          case to what ideas 1 and 2 asserted (Step 2), so it is a late
          part of the treatment of A and needs an announcement. The last
          idea of the run, idea 2, says which part remains (unequal sizes)
          and where it is treated, and idea 5 treats that part and nothing
          else of A. The reader of ideas 3 and 4 knows that "negative" is a
          statement about equal sizes. §3 discusses one case and §4.2 the
          other, so neither stretch is a discussion by cases under A5; the
          pointer in idea 2 is what A5 asks of a single case. It is a
          promissory note in the sense of A1: the open case is fully
          intelligible where it is named. (Constructed for this axiom.)

  - id: "A7_no_open_question"
    name: "No question that the text raises is left open"
    one_liner: "A question the text has made the reader ask is closed before the flow turns to anything else: answered, deferred to a named place, or declared open. Between the question and its closing stand only parts of the answer."

    statement_natural: |
      A reader can stop at any point of an article and ask a question. At
      no point may the flow leave the reader holding a question that the
      text itself has made them ask. When the text raises a question, it
      closes it before it turns to anything else. Between the place where
      the question is raised and the place where it is closed, the flow
      holds only parts of the answer: a reason, a step, a case, or the
      result that the question asks for. This does not depend on how the
      text is cut into ideas: whether the passage is one idea or three,
      nothing off the question stands in between.
      A question is closed in one of three ways. This list is closed.
        (1) Answered. The idea that raises the question answers it, or the
            ideas that follow it without a break are parts of the answer
            and complete it.
        (2) Deferred. The idea that raises the question, or the answer so
            far, says where in the article the question, or the rest of
            it, is answered. The pointer is a forward pointer of A1, so
            the question is fully intelligible where it is raised. When
            one idea raises several questions, it says in which order they
            are answered, and that defers all but the first.
        (3) Declared open. The idea that raises the question, or the
            answer so far, says that the article does not answer it: a
            limitation, or a question for later work.
      The Introduction has a rule of its own, because A4 fixes its order.
      A statement of what is not known is closed by the statement of the
      research question that follows it in the Introduction, however many
      other statements of what is known or not known stand between the
      two. The research question is closed by the statement of what the
      article finds (A4) or by the roadmap, either of which follows it in
      the Introduction.
      The text raises a question in four ways. This list is closed as
      well, so that the rule can be checked idea by idea.
        (a) It asks one, directly or by saying that something is unclear,
            unknown or yet to be determined.
        (b) It asserts a claim that goes beyond what an undergraduate
            course in the field teaches, and shows no ground for it: no
            reason, no citation, no derivation, and no pointer to one.
        (c) It states a choice, or departs from what it has announced, and
            gives no reason. A choice is of one of six kinds, and this
            list is closed: a method; an estimator or a statistic; a
            measure; a sample, that is, which observations or cases are
            used or dropped; a value, that is, a constant, a threshold or
            a cut-off; a case, that is, which case is treated. The choice
            counts whether or not the text has named the alternatives.
            What the article is about, the objects named in its research
            question, is not a choice in this sense.
        (d) It states something that appears to conflict with what it
            stated earlier, and does not say how the two stand together.
      On a flow, which has one line for each idea, the ground of (b) and
      the reason of (c) are read from the line or from the note of the
      idea: a clause, a citation, or a pointer to where the derivation is.
      An idea whose line and note show none raises the question.
      A question that a reader brings and that the text did not raise in
      one of these four ways is outside this axiom. So is the abstract: it
      is a summary, and each of its claims is taken up by the article as a
      whole.
      A2, which generalizes mathematical-writing A5_motivated_by_prefix,
      says that an element arrives only after the question it answers.
      This axiom is its converse: a question, once raised, does not wait.
      A2 looks back from each answer to its question; this axiom looks
      forward from each question to its answer. A flow can satisfy A2 and
      fail here: the answer does come after its question, but several
      sections later and with nothing said in between. A flow can also
      satisfy this axiom and fail A2: an example placed before its question
      leaves no question open. A1 allows the promissory note; this axiom
      adds that a question is postponed only by saying so.
      The remedy is to reorder or to say where. Either the answer moves
      next to the question (A8), or the idea that raises the question gets
      the pointer of (2) or the declaration of (3).

    statement_formal: |
      Let d_1, …, d_M be the ideas of the flow in reading order. Let
      Raised(d_i) be the questions that d_i raises through a trigger in
      T = {asked, ungrounded claim, unexplained choice, apparent conflict}
      (closed), where a choice is of a kind in {method, estimator or
      statistic, measure, sample, value, case} (closed) and the objects
      named in the research question are not choices. For a question q
      let Ans(q) be the ideas that are a part of the answer to q.
        Closed(q), for q ∈ Raised(d_i)  ⇔  ∃ m ≥ i such that
            d_j ∈ Ans(q) for every j with i < j ≤ m, and one of:
            Answered:      the answer to q is complete at d_m;
            Deferred:      some d_j with i ≤ j ≤ m names the place where q,
                           or the rest of q, is answered; every item
                           needed to understand q is introduced no later
                           than d_i (the pointer is E1 or E2 of A1); and
                           the idea at that place answers it;
            DeclaredOpen:  some d_j with i ≤ j ≤ m says that the article
                           does not answer q.
        Dispositions = {answered, deferred, declared open} is closed.
        Rule:  ∀ i, ∀ q ∈ Raised(d_i):  Closed(q).
        Cut invariance:  Closed(q) is unchanged when the ideas from d_i to
          d_m are merged or split, since it asks only that every sentence
          between the raising of q and its closing be part of the answer.
      Introduction:  a statement g of what is not known, at d_i in the
        Introduction, is closed iff the research question is stated at
        some d_r with r > i in the Introduction. The research question is
        closed iff the statement of findings or the roadmap follows it in
        the Introduction.
      The ideas of the abstract are not constrained.
      Relation to A2:
        A2:  ∀ element e, ∃ j < pos(e): d_j raises Q(e)    (from the answer
                                                             back to the
                                                             question)
        A7:  ∀ q ∈ Raised(d_i): Closed(q)                   (from the
                                                             question on to
                                                             the answer)
        Neither implies the other.
      Remedy — reorder or say where:  if q ∈ Raised(d_i) is not closed,
        either  move the ideas that answer q to follow d_i (A8),
        or      add to d_i the pointer (Deferred) or the declaration
                (DeclaredOpen).

    rationale: |
      The writer knows that the answer is coming and so does not feel the
      question as open. The reader does not know, and reads the next pages
      with part of their attention on the question: was the choice
      arbitrary, is the claim true, which of the two statements holds? What
      they read meanwhile is weighed less well, and a careful reader starts
      to distrust the text. One sentence at the place where the question
      arises is enough to prevent this: it gives the reason, or it says
      where the reason is, or it says that the article leaves the question
      open. The four triggers are a closed list because "any question a
      reader might have" cannot be checked, while "did this idea ask
      something, assert something without a ground, choose without a
      reason, or seem to contradict an earlier idea?" can be answered for
      each idea in turn. A choice counts even when no alternative has been
      named, because otherwise the rule would reward the text that hides
      its alternatives: "we drop the first fifty observations" raises
      "why?" whether or not the text says what else could have been done.
      The window is stated as "only parts of the answer in between" and
      not as "the next idea", because where one idea ends and the next
      begins is the writer's cut, and a rule that depends on the cut can be
      met by cutting differently. A2 does not cover this. A2 is satisfied
      as soon as every answer has its question somewhere before it,
      however far before.

    violations:
      - description: "A choice is stated without a reason, and the reason arrives seven ideas later"
        content: |
          Idea 1. Two summaries of the typical score are in use, the mean
          and the median.
          Idea 2. We use the median throughout.
          Idea 3. The data: 40 schools, 1,900 students.
          Ideas 4 to 8. The measures, the procedure, the descriptive
          results.
          Idea 9. The scores have heavy tails, and with heavy tails the
          median varies less from sample to sample than the mean; this is
          why the median was used.
        explanation: |
          Idea 2 states a choice of a statistic and gives no reason:
          trigger (c). The trigger does not need idea 1: without it, "we
          use the median throughout" is still a choice of one of the six
          kinds. Idea 3 is not part of the answer, and nothing in idea 2
          says where the reason is, so the reader carries "why the median?"
          through ideas 3 to 8. A2 holds, since the reason in idea 9 comes
          after the question it answers, and A1 holds, since no idea leans
          on a later one. (Constructed for this axiom; not taken from a
          manuscript.)
      - description: "A later idea appears to conflict with an earlier one, and nothing says how the two stand together"
        content: |
          Idea 4. Estimator A is the more accurate of the two, by the
          comparison of their mean squared errors to the first order.
          Idea 7. In Table 2, estimator B has the smaller error at n = 20.
          Idea 8. The computing time of the two estimators.
        explanation: |
          Idea 7 appears to conflict with idea 4: trigger (d). The reader
          asks which statement holds, and idea 8 is not part of the answer.
          (Constructed for this axiom.)

    compliant:
      - description: "The three ways of closing a question: answered at once, deferred to a named place, declared open"
        content: |
          Answered. Idea 2. We use the median throughout, because the
          scores have heavy tails, and with heavy tails the median varies
          less from sample to sample than the mean.
          Deferred. Idea 2. We use the median throughout. The reason is
          given in Section 4, with the distribution of the scores.
          Declared open. Idea 12. Whether the same choice is right for the
          scores of other age groups is not examined in this article.
        explanation: |
          In the first version idea 2 gives the reason with the choice. In
          the second it gives no reason and says where the reason is; the
          question is intelligible where it stands, so the pointer is a
          forward pointer of A1. In the third the text raises a question
          and says in the same idea that the article does not answer it. In
          none of the three does the flow turn to something else with the
          question unmarked. (Constructed for this axiom.)
      - description: "An apparent conflict is resolved in the idea that creates it"
        content: |
          Idea 4. Estimator A is the more accurate of the two, by the
          comparison of their mean squared errors to the first order. From
          what sample size on this shows is examined with Table 2, in
          Section 5.
          Idea 7. In Table 2, estimator B has the smaller error at n = 20:
          the comparison of Section 2 is to the first order, and at n = 20
          the terms it leaves out still matter. From n = 50 on, the same
          table shows the smaller error for A.
        explanation: |
          Idea 7 says how its statement stands with idea 4 in the same idea
          that would otherwise raise the question. It qualifies what idea 4
          asserted, and it depends on Table 2, which comes after idea 4, so
          under A6 it is a late part of that topic; idea 4 announced it.
          (Constructed for this axiom.)

  - id: "A8_rearrangement_operations"
    name: "A flow is rearranged only by the listed operations"
    one_liner: "To make a flow read in order, ideas may be swapped, moved earlier, moved later, merged or split, each under its condition; no claim is deleted, duplicated, added or restated. The list is closed, and it is a proposal for the author to cut or extend."
    status: "Proposal (2026-11-26). The principle is the author's; the list of operations was drafted for the author to cut or extend, by a later entry."

    statement_natural: |
      A flow may be rearranged so that it reads in order. Rearrangement is
      the remedy that A1, A2, A5, A6 and A7 prescribe, and it is legitimate
      when it is a sequence of the operations below, each applied under its
      condition. A rearrangement changes the order and the grouping of
      ideas and nothing else: every claim of the flow before is in the flow
      after, and no claim is new or changed. A claim that the flow stated
      in two places is stated once after a merge; that is not a deletion,
      since the claim is still there.
      The operations. This list is closed: a change to a flow that is not a
      sequence of these operations is not a legitimate rearrangement.
        (R1) Swap. Two adjacent ideas, or two adjacent blocks of ideas,
             exchange places. Condition: neither depends on the other (A1),
             and neither raises the question the other answers (A2).
        (R2) Move earlier. An idea, or a block, moves to an earlier
             position. Condition: every item it depends on is introduced
             before the new position (A1), and, if it answers a question,
             that question is raised before the new position (A2).
        (R3) Move later. An idea, or a block, moves to a later position.
             Condition: no idea between the old position and the new one
             depends on it (A1) or answers a question that only it raises
             (A2).
        (R4) Merge. Two adjacent ideas that treat the same topic become
             one idea. Condition: they treat the same topic (A6), and every
             distinct claim of the two is kept, once. Ideas that are not
             adjacent are first brought together by R2 or R3.
        (R5) Split. One idea becomes two adjacent ideas, each of which may
             then move. Condition: every claim of the idea goes to exactly
             one of the two.
      Two common uses are sequences of these operations and are not
      further operations. Putting a worked consequence (a corollary, an
      example, a numerical illustration) next to the result it follows
      from is R2 or R3 with that position as the target. Sending the
      detail of an idea to the appendix is R5 followed by R3; it also
      needs the sentence in which the home idea says what the appendix
      item establishes and points to it (A9), and that sentence is an
      insertion, judged as said below.
      Three conditions hold for every operation.
        (i)   What cites the moved text is known before it moves
              (mathematical-writing A3_replacement_precondition), and a
              pointer that the move turns around is rewritten to point
              backward.
        (ii)  A case moves with its frame: when the order of the cases
              changes, the announcement of A5 is rewritten to the new
              order.
        (iii) After the sequence, the flow is checked again against A1 to
              A7 and A9. The conditions of R1 to R3 keep A1 and A2 for the
              ideas that moved. They do not by themselves keep an object
              next to its sentence of literature (A3), the article's own
              results after the research question (A4), a frame in order
              (A5), a topic in one place (A6), a question next to its
              answer (A7), or a display and an appendix item with their
              home ideas (A9).
      Four changes are outside the list, whatever they do for the
      smoothness of the flow. This list names what the operations are not;
      it is not a list of further permissions.
        Deleting. Removing an idea removes a claim; the remedies of A1, A2
          and A6 are to reorder, not to delete.
        Duplicating. Stating a claim in two places breaks A6.
        Inserting. A new sentence, such as the transition that A2 allows
          as its other remedy, the pointer of A7 or the pointing sentence
          of A9, adds text. Those axioms permit it; it is not a
          rearrangement, and the added sentence is judged as new content.
        Restating. Changing the scope, the assumptions or the form of a
          claim is a revision of content, not a rearrangement, and it is
          judged as new content under the axiom that asks for it. The
          repair that mathematical-writing A7_general_case_first asks for
          is of this kind: after the reduction, results are restated for
          the simple form and the second derivation goes. Moving the
          reduction to the head of the section is R2; restating the
          results is a revision.

    statement_formal: |
      Let F = (d_1, …, d_M) be a flow and Claims(F) the set of its distinct
      claims. Write Dep(x, y) when x depends on an item that y introduces
      (A1), and Ask(y, x) when y raises the question that x answers (A2).
        swap(x, y), x and y adjacent:    requires ¬Dep(x, y), ¬Dep(y, x),
                                         ¬Ask(x, y), ¬Ask(y, x)
        earlier(x, p), p < pos(x):       requires ∀ y: Dep(x, y) ⇒ pos(y) < p,
                                         and, if x answers a question,
                                         ∃ y: Ask(y, x) ∧ pos(y) < p
        later(x, p), p > pos(x):         requires, for every y with
                                         pos(x) < pos(y) ≤ p:  ¬Dep(y, x),
                                         and ¬Ask(x, y) unless some z with
                                         pos(z) < pos(x) also raises that
                                         question
        merge(x, y), x and y adjacent:   requires a topic t with
                                         Treats(x, t) and Treats(y, t), and
                                         Claims(x ⊕ y) = Claims(x) ∪ Claims(y)
        split(x) = (x′, x″):             requires Claims(x′) ∪ Claims(x″)
                                         = Claims(x) and
                                         Claims(x′) ∩ Claims(x″) = ∅
      Ops = {swap, earlier, later, merge, split} is closed.
        Legitimate(F → F′)  ⇔  F′ is obtained from F by a finite sequence
                               of operations in Ops, each meeting its
                               requirement, and (i), (ii), (iii) hold.
        Invariant:           Legitimate(F → F′)  ⇒  Claims(F′) = Claims(F)
                             as sets. A claim made twice in F may be made
                             once in F′.
        Outside Ops:         delete(x):     Claims(F′) ⊊ Claims(F)
                             duplicate(x):  the same claim in two ideas
                                            that are not merged; breaks A6
                             insert(s):     Claims(F′) ⊋ Claims(F); judged
                                            under A2, A7 or A9
                             restate(c → c′):  c ∉ Claims(F′) and
                                            c′ ∉ Claims(F); judged under the
                                            axiom that asks for it.

    rationale: |
      The earlier axioms say "reorder, do not delete" and leave open what a
      reordering is. In practice a flow is rearranged for smoothness under
      time pressure, and three things go wrong without anyone deciding
      them: a claim is dropped because it no longer fits anywhere, an idea
      is moved across something it depends on, and a case is moved out of
      its frame. A permission to "rearrange as needed" covers all three,
      because every edit can be called a rearrangement. A closed list of
      operations, each with a condition stated in terms of the axioms that
      already exist, makes each step something that can be checked: the
      step is one of five, and its condition holds or does not. The
      invariant, that the set of claims before and after is the same, is
      what separates rearranging from rewriting. It is a set and not a
      count, so that a claim made twice can be brought to one place and
      said once: a repetition has to have a lawful repair.
      Restating is named among the changes outside the list because some
      remedies need it and it must not pass as a rearrangement. A flow that
      derives a result twice, for a simple and for a general setting, is
      repaired by a reduction and by restating the results; the move of the
      reduction is checked here, and the restated results are checked as
      content.
      The list is a proposal. It was drafted from the author's request
      that the legitimate operations be written down, and it is meant to be
      cut or extended. R1 is the case of R2 over one position, stated with
      a symmetric condition; it is listed because exchanging two
      neighbouring blocks is the commonest rearrangement, and it can be
      cut without loss. The two named uses are given as sequences so that
      the list stays short.

    violations:
      - description: "An idea is moved earlier across an idea it depends on"
        content: |
          Before.
          d1. The design: several groups of unequal size, with the same
          variance within each group.
          d2. The pooled estimator is a weighted average of the group
          means.
          d3. Its variance is smallest under the weights w_i defined in
          Section 4.
          d4. The design of the simulation.
          d5. The weights are w_i = n_i / N, and in the simulation of d4
          they range from 0.05 to 0.40.
          Change: d5 is moved to stand before d3.
        explanation: |
          The move is R2, and its condition fails: d5 depends on d4, the
          design of the simulation, which is not before the new position.
          The change repairs the forward dependence of d3 and creates a new
          one, since the simulation is now cited before it is described.
          (Constructed for this axiom; not taken from a manuscript.)
      - description: "A flow is smoothed by deleting the idea that did not fit"
        content: |
          Same flow. Change: the sentence of d3 about the weights is
          deleted, and d5 stays where it is.
        explanation: |
          The forward dependence is gone and so is a claim: the flow no
          longer says under which weights the variance is smallest. Deletion
          is not one of the five operations, and Claims(F′) ⊊ Claims(F).
          (Constructed for this axiom.)

    compliant:
      - description: "Split, then move earlier: the dependence is turned backward and every claim is kept"
        content: |
          Step 1, R5. d5 is split into d5a (the weights are w_i = n_i / N)
          and d5b (in the simulation of d4 they range from 0.05 to 0.40).
          Step 2, R2. d5a moves to stand between d2 and d3.
          After.
          d1. The design: several groups of unequal size, with the same
          variance within each group.
          d2. The pooled estimator is a weighted average of the group
          means.
          d5a. The weights are w_i = n_i / N.
          d3. The variance of the pooled estimator is smallest under these
          weights.
          d4. The design of the simulation.
          d5b. In the simulation the weights range from 0.05 to 0.40.
        explanation: |
          R5: each claim of d5 is in exactly one of d5a and d5b. R2: d5a
          depends only on the group sizes of d1, which come before the new
          position, and the question it answers (with what weights?) is
          raised by d2. The pointer in d3 now points backward, as condition
          (i) asks, after a search showed that nothing else cited d5. The
          set of claims is the same before and after. The check of
          condition (iii) finds nothing disturbed: the choice of the
          weights in d5a has its reason in the next idea (A7), and d5b
          depends on the simulation and amends nothing said earlier about
          the weights (A6). (Constructed for this axiom.)
      - description: "A claim made in two places is brought together and stated once"
        content: |
          Before.
          e1. Estimator A is unbiased when the groups have equal sizes.
          e2. Variance of estimator A.
          e3. Bias and variance of estimator B.
          e4. For groups of equal size, estimator A has no bias.
          Step 1, R2. e4 moves to stand after e1; it depends on nothing
          that e2 or e3 introduces.
          Step 2, R4. e1 and e4 are merged.
          After.
          e1. Estimator A is unbiased when the groups have equal sizes.
          e2. Variance of estimator A.
          e3. Bias and variance of estimator B.
        explanation: |
          e1 and e4 make the same claim in different words, which breaks
          A6. R4 keeps every distinct claim of the two once, so the merged
          idea states the claim once, and the set of claims is unchanged.
          Nothing was deleted in the sense of this axiom: no claim of the
          flow before is missing after. (Constructed for this axiom.)

  - id: "A9_contributions_displays_appendix"
    name: "The contributions, the figures and tables, and the appendix are planned with the flow"
    one_liner: "A flow comes with three lists tied to its ideas: a list of contributions, not empty, each naming the idea that establishes it; for each section its figures and tables, each with a home idea; and for each section what goes to the appendix, whose ideas are ideas of the flow."

    statement_natural: |
      A flow is planned together with three lists, and each list is tied to
      the ideas of the flow.
        (1) Contributions. The flow has a list of what the article claims
            to add, with at least one entry. Each contribution names the
            idea of the body that establishes it: the idea that states it
            and gives its ground. Where the article announces the
            contribution in the Introduction or recalls it in the closing
            section, the list names those ideas too. A contribution with
            no establishing idea is taken off the list or given its idea.
        (2) Figures and tables. For each section, the flow records the
            displays of that section, or records that it has none. Each
            display has a home idea: the first idea that says what the
            display shows. The home idea refers to the display, and the
            display shows or supports a claim of the home idea. Later
            ideas may explain other parts of the display and cite it. A
            display with no home idea is not in the article.
        (3) Appendix. For each section of the main text, the flow says
            what of that section goes to the appendix (proofs,
            derivations, further tables, further checks), or that nothing
            does. Each appendix item has a home idea in the main text,
            which states what the item establishes and points to it. No
            idea of the main text depends on content of an appendix item
            that its home idea does not state; this is A1 applied to the
            appendix, which the reader meets last.
      The ideas of an appendix are ideas of the flow. They stand after the
      main text, and A1, A2 and A5 to A8 hold of them as of any other
      ideas: an appendix has its own order, its frames for cases and its
      questions closed, like a section. Under A6 an appendix item is the
      announced continuation of the topic of its home idea.
      The conditions are checked on the flow and its lists. A list that is
      absent fails its condition; it does not pass for want of entries.
      The converse of (1) is not required: an idea may establish something
      that the article does not list as a contribution.
      A2 already says when a figure or a table may appear, after the
      question it answers. This axiom says which idea each display and each
      appendix item belongs to, and that the list of contributions is
      checked against the ideas. mathematical-writing
      A6_prior_result_attribution governs what may be put on the list of
      contributions; this axiom governs whether the flow delivers what is
      on it.

    statement_formal: |
      Let F be the flow, K the list of contributions, Sec the sections of
      the main text, and for s ∈ Sec let Displays(s) and Appendix(s) be the
      records of s. Let V = ∪_s Displays(s) and X = ∪_s Appendix(s).
        Listed:    K ≠ ∅.
        Carried:   ∀ c ∈ K, K names an idea est(c) in the body of F that
                   states c and gives its ground; where F has an idea that
                   announces c in the Introduction or recalls c in the
                   closing section, K names it.
        Recorded:  ∀ s ∈ Sec, F records Displays(s) and Appendix(s), each
                   possibly ∅. A missing record is a failure, not ∅.
        Served:    ∀ v ∈ V, home(v) exists, where home(v) is the first idea
                   of F that says what v shows; home(v) refers to v, and v
                   shows or supports a claim of home(v).
        Homed:     ∀ x ∈ X, ∃ idea home(x) in the main text that states
                   what x establishes and points to x; and no idea of the
                   main text depends on content of x that home(x) does not
                   state (A1).
        Appendix ideas:  the ideas of each x ∈ X belong to F, after the
                   main text, and A1, A2, A5, A6, A7 and A8 apply to them.
      Not required:  that every idea of the body corresponds to some c ∈ K.
      Remedy:  write the missing list or record; for c with no est(c),
        remove c from K or add the idea; for v or x with no home, name the
        home idea or remove v or x.

    rationale: |
      The list of contributions, the displays and the appendix are usually
      made at other times than the argument: the contributions when the
      Introduction is drafted, the figures when the analysis is run, the
      appendix when the main text has grown too long. Each can then drift
      from the flow. A contribution is promised in the Introduction and no
      section delivers it. A figure remains from an earlier version and no
      paragraph says what it shows. A proof is moved to an appendix and the
      main text still leans on a step inside it, or the appendix itself is
      a pile of derivations in the order in which they were found. None of
      this shows when the flow is read alone, because the flow does not
      mention what is missing from it. Tying each list to named ideas makes
      the checks mechanical. The records are kept section by section, and
      an empty record is written down as empty, because the point is that
      the question was asked while the structure was being planned: does
      this section need a figure or a table to be believed, and which of
      its parts can a reader do without on a first reading? A plan that
      lists no displays because nobody thought about them cannot be told
      from one that needs none unless each section says so. The list of
      contributions may not be empty for the same reason: the flow is
      arranged so that the article delivers what it claims, and that
      cannot be checked against nothing.

    violations:
      - description: "A listed contribution that no idea establishes, a figure that no idea explains, and an appendix that the flow does not plan"
        content: |
          Contributions listed in the Introduction:
            C1. Worked-example lessons raise the end-of-term score of
                students in the lowest third. Established by idea 9.
            C2. The gain is still present one term later. Established by
                idea 11.
            C3. A new scale of mathematics anxiety is validated. No idea
                named.
          Flow of the body: the scale of C3 is used as a covariate; no idea
          reports its validation.
          Displays: the flow lists Table 1 (scores by group), explained by
          idea 9, and Figure 2 (attendance by month), explained by no idea.
          The list is not kept by section.
          Appendix: Appendix B holds the wording of the items. The flow of
          Section 3 (Method) says nothing about an appendix, and no idea
          points to Appendix B.
        explanation: |
          Carried fails: C3 names no establishing idea, and the body has
          none. Served fails: Figure 2 has no home idea. Recorded fails
          twice: the displays are not recorded section by section, so it
          cannot be seen whether Sections 2, 3 and 5 were considered, and
          Section 3 has no record for the appendix. Homed fails: Appendix B
          has no home in the main text. Table 1, C1 and C2 are in order.
          (Constructed for this axiom; not taken from a manuscript.)
      - description: "A flow with no list of contributions and no displays recorded"
        content: |
          The flow has 14 ideas in five sections. It has no list of
          contributions, and no section records its displays or what goes
          to the appendix.
        explanation: |
          Nothing listed is wrong, because nothing is listed. Listed fails
          (K is empty) and Recorded fails for every section. An absent list
          does not pass for want of entries. (Constructed for this axiom.)

    compliant:
      - description: "The same article with its three lists tied to ideas"
        content: |
          Contributions:
            C1. Established by idea 9; announced in the Introduction
                (idea 3); recalled in the Discussion (idea 13).
            C2. Established by idea 11; announced in the Introduction
                (idea 3); recalled in the Discussion (idea 13).
            The validation of the scale is not claimed.
          Records, by section:
            Section 1 (Introduction). Displays: none. Appendix: nothing.
            Section 2 (Background). Displays: none. Appendix: nothing.
            Section 3 (Method). Displays: none. Appendix: the wording of
            the items goes to Appendix A; home idea 6 ("the scale has 12
            items; their wording is in Appendix A").
            Section 4 (Results). Displays: Table 1 (scores by group), home
            idea 9; Figure 1 (the gain by third, at the end of term and one
            term later), home idea 11. Appendix: the scores by school go to
            Appendix B; home idea 10 ("the gain has the same sign in 36 of
            the 40 schools; the scores by school are in Appendix B").
            Section 5 (Discussion). Displays: none. Appendix: nothing.
          Appendix A has one idea (the 12 items, in the order in which they
          were given). Appendix B has two (the table of scores by school;
          the four schools with a gain of the other sign).
        explanation: |
          The list of contributions has two entries, and each names the
          idea that establishes it and the ideas that announce and recall
          it. Every section has both records, most of them empty and
          written down as empty. Each display has a home idea, the first
          that says what it shows. Each appendix item has a home idea that
          states what the item establishes, so that the main text can be
          read and checked without opening the appendix, and the ideas of
          the two appendices are listed in the flow like those of a
          section. The contribution with no idea was taken off the list,
          which is one of the two remedies. (Constructed for this axiom,
          like the violations.)
