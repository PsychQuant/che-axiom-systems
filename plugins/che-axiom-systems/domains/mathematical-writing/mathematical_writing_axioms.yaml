# ASBE Domain — Mathematical Writing
# Follows templates/domain-template.yaml. Validate with /axiom-validate.

meta:
  domain: "Mathematical Writing"
  version: "1.0.0"
  author: "Che Cheng"
  created: "2026-07-05"
  description: |
    Axiomatizes the craft of producing formal mathematical prose for readers:
    where mathematical material is placed and how claims are set out — the
    theorem / proposition / definition / remark architecture and the rigor
    conventions of exposition. Sibling to `mathematical-learning` under a
    consume/produce symmetry: learning concerns acquiring mathematics, writing
    concerns setting it out; the two share primitives (theorem, proof,
    definition) but operate on them in opposite directions. Distinct from
    `note-writing` (personal notes); this domain is formal exposition addressed
    to peer readers. Seeded with statement placement (A1); designed to accrete
    further exposition axioms (constructive-over-existential presentation,
    avoidance of "obviously"/"clearly", direction discipline for bounds,
    definition-scope hygiene, equation numbering).

# Primitive terms — undefined concepts that form the foundation
primitives:
  - term: "Object-level statement"
    intuition: |
      A claim quantifying over the specific objects of a theory and asserting a
      relation among them — how one quantity stands relative to another.
  - term: "Meta-level statement"
    intuition: |
      A claim quantifying over the theory or framework itself and asserting a
      property of the machinery — that a quantity the framework reads off is
      invariant under a perturbation, that a construction is well-defined, that
      adding some term changes nothing the framework computes.
  - term: "Container"
    intuition: |
      The structural slot a statement is placed in: a Theorem / Proposition /
      Lemma (load-bearing, proved) versus a Remark (commentary, interpretation).
  - term: "Altitude"
    intuition: |
      The level at which a statement quantifies — over objects of the theory
      (object-level) or over the framework (meta-level). Altitude is relative to
      the system one is writing inside: the same sentence can be a remark in a
      manuscript yet an axiom in a system that axiomatizes the manuscript's craft.

  - term: "Repair round"
    intuition: |
      A revision that corrects an identified defect in a statement. Its
      characteristic move is to add a qualification at the point where the
      defect was found, which is normally inside the statement being repaired,
      because that is where the reader met the error.
  - term: "Citation set"
    intuition: |
      The references that address a statement: those naming its label, and those
      whose span contains it. A range reference covers whatever currently lies
      between its endpoints, so a statement can enter or leave a citation set
      without any reference to it being edited.

axioms:
  - id: "A1_altitude_placement"
    name: "Statement placement by altitude"
    one_liner: "Object-level relations earn theorem status; meta-level framework properties belong in remarks; never state the same content in both."

    statement_natural: |
      A mathematical statement is placed by its altitude. If it asserts a relation
      among specific objects of the theory — how one quantity stands relative to
      another — it is object-level and belongs in a theorem (or proposition /
      lemma). If it asserts a property of the theory or framework itself — that a
      quantity the framework reads off is invariant under a perturbation, that a
      construction is well-defined, that adding some term changes nothing the
      framework computes — it is meta-level and belongs in a remark. A single
      theorem should hold one altitude: a meta-level clause grafted onto an
      object-level result dilutes the result's structure and forces the reader to
      switch levels mid-statement. And the same content must not appear in both
      containers: once the object-level core is a theorem, the remark points to it
      and interprets, rather than restating it.

    statement_formal: |
      For a statement S about a theory T with object domain Obj(T):
        level(S) = object   if S asserts  R(o_1, …, o_n)  for specific o_i ∈ Obj(T)
                            (a relation among specific objects of the theory)
        level(S) = meta     if S asserts  P(T) — a property of the framework itself,
                            e.g. (∀ q ∈ Reads(T)) Inv(q, δ) for a perturbation δ,
                            where Reads(T) is the set of quantities the framework
                            reads off
      Placement rule:
        level(S) = object  ⟹  container(S) = Theorem   (or Proposition / Lemma)
        level(S) = meta    ⟹  container(S) = Remark
      Single-altitude:   ∀ Θ ∈ Theorems, ∀ clause c ∈ Θ :  level(c) = object
      Non-duplication:   ¬∃ S :  content(S) placed in Theorem ∧ content(S) placed in Remark

    rationale: |
      A theorem is read as "these specific objects stand in this relation." A
      framework-robustness claim answers a different question at a higher altitude
      — "is the machinery well-defined / stable under this perturbation?" Fusing
      the two costs the theorem its clean structure and forces an altitude switch
      inside one statement. Separating them gives each container one job — the
      theorem states the object-level fact, the remark interprets and reports
      framework-level robustness — and removes the redundancy of saying one thing
      twice.

    violations:
      - description: "Meta-level invariance folded into an object-level dichotomy theorem"
        content: |
          Theorem. (i) If r_D > 0, the full sum exists and the gap D_J − D_{J,∞}
          is beyond all orders. (ii) If r_D = 0, the series is only Poincaré
          asymptotic. (iii) Moreover, every quantity the framework reads off — the
          radius, the leading order, the deficiency coefficient — is a function of
          the coefficients {Δ_k} alone, hence unchanged by any beyond-all-orders
          residual.
        explanation: |
          Clause (iii) is meta-level: a well-definedness claim about the framework,
          grafted onto an object-level (i)/(ii) dichotomy about where the sum
          stands. It breaks the two-branch structure and switches altitude inside
          the theorem.

    compliant:
      - description: "Object-level iff kept in the theorem; meta-level robustness moved to a remark"
        content: |
          Theorem (i). If r_D > 0, the gap D_J − D_{J,∞} is beyond all orders; and
          equality D_J = D_{J,∞} holds if and only if D_J is analytic in z = 1/J
          at 0.
          Remark. Every quantity the framework reads off is a function of {Δ_k}
          alone, so a beyond-all-orders residual changes nothing it computes.
        explanation: |
          The theorem asserts an object-level relation between D_J and D_{J,∞}
          (the sharp iff included); the framework-invariance observation, being
          meta-level, lives in the remark and does not restate the theorem — one
          altitude per container, no duplication.

  - id: "A2_repair_accretion"
    name: "Altitude drift under repair"
    one_liner: "Repair rounds accrete meta-level qualifications inside statements; re-check altitude after repair, and relocate rather than delete."

    statement_natural: |
      Iterative repair drives altitude drift. When a defect is found in a
      theorem, the correction gets written at the point of failure — inside the
      statement — because that is where the reader met the error. Each such
      qualification is individually justified and individually small, and no
      single round violates A1. But what accumulates is meta-level: the limits of
      a hypothesis, the scope of an index, what the result does not claim. After
      several rounds the statement no longer holds one altitude, and it did so
      without any round doing anything wrong.
      Two consequences. First, altitude must be re-checked as an act distinct
      from checking correctness, on a schedule set by the number of repair rounds
      rather than by the size of any one change; no individual defect raises the
      question, so nothing else will. Second, the remedy is relocation, not
      deletion. Every accreted clause was earned by a defect someone actually
      found, so cutting it for concision re-opens that defect and discards the
      record of what was learned. Moving it to a remark achieves the same
      concision and keeps both.

    statement_formal: |
      Let Θ₀ be a statement and Θ_{n+1} = repair(Θ_n, d_n) correct defect d_n by
      adjoining qualification q_n.
        typically   level(q_n) = meta                       (limits, scope, non-claims)
        so          purity(Θ_n) := |{c ∈ Θ_n : level(c) = object}| / |clauses(Θ_n)|
                    is non-increasing in n, while  correct(Θ_n) holds for every n.
      Hence:  (∀n) correct(Θ_n)  ⊬  A1(Θ_n).       // correctness does not preserve altitude
      Remedy — split, do not shrink:
        concise(Θ_n) = (Θ′, R)  with  content(Θ′) ∪ content(R) = content(Θ_n),
                       (∀c ∈ Θ′) level(c) = object,  (∀c ∈ R) level(c) = meta
      Prohibited:
        content(Θ′) ∪ content(R) ⊊ content(Θ_n)     // deletion in the name of concision

    rationale: |
      The failure is diachronic, so it is invisible to any single review. Each
      round asks "is this sentence correct?" and each answer is yes; nobody asks
      "is this statement still one altitude?", because no individual defect
      raises that question. The remedy most readers reach for — it is too long,
      cut it — is the one that loses information, since every clause marks a
      defect that was actually found. A1 says where material belongs; A2 says
      that repair systematically puts it somewhere else, and that noticing this
      requires a check nobody is prompted to run.

    violations:
      - description: "A proposition grown to fifty-five lines over seven repair rounds, each round adding a meta-level clause to the statement"
        content: |
          Proposition (Truncation order and the superasymptotic bound).
          (i) Attainability, from Assumption 3 alone. Suppose J ≥ K₀C(θ), so
          that K*(J) ≥ K₀ and (5.8) is in force at that order. The bound
          M k^p C^k k! J^{-k} is minimized over k ≥ K₀, to leading order, at
          k = J/C, where it equals exp(−J/C) up to an algebraic factor. Since
          t_k(J) never exceeds that bound there, [display]. Truncating at K*(J)
          therefore achieves a term magnitude at most that size; for irregular
          coefficients it can be far smaller. The statement does not assert that
          K*(J) minimizes t_k(J): an upper bound on the coefficients cannot
          decide where the terms themselves are smallest.
          (ii) … The restriction to k ≥ k_LT is not cosmetic: (5.11) governs late
          terms only and cannot speak to finitely many vanishing leading
          coefficients, and this model has them — Δ₁ ≡ 0 throughout, so
          t₁(J) = 0 is the minimum over all k ≥ 1 at every J. Only under this
          hypothesis is K*(J) an optimal order among k ≥ k_LT, rather than merely
          a good one. What (5.11) does not give is a single crossing. …
          (iii) … The factor may not be absorbed into the exponential: J^q e^{−J/C}
          is not O(e^{−J/C}).
          In all three parts the exponential scale worsens as C(θ) grows, …
        explanation: |
          Every added clause was correct and each was earned by a real defect, so
          no round violated A1 on its own. But "does not assert", "is not
          cosmetic", "what (5.11) does not give", "may not be absorbed" are all
          meta-level: they describe the limits of the hypotheses, not relations
          among the objects. The three object-level assertions are now buried in
          an essay about their own scope.

    compliant:
      - description: "The same content, split by altitude: three assertions in the proposition, the limits in the remark that follows"
        content: |
          Proposition (Truncation order and the superasymptotic bound).
          Write t_k(J) := |Δ_k(θ)| J^{-k}; set K*(J) = ⌊J/C(θ)⌋. In (i) and (iii)
          let J ≥ K₀C(θ), so that K*(J) ≥ K₀.
          (i)   t_{K*(J)}(J) ≤ P(J) exp(−J/C(θ)).
          (ii)  Let k_LT be an index beyond which Δ_k(θ) ≠ 0. For all J large,
                t_k(J) attains its minimum over k ≥ k_LT at an order
                J/C(θ) + o(√J), of size exp(−J/C(θ)) up to an algebraic factor.
          (iii) |D_J − D_{J,K*(J)}| ≤ P̃(J) exp(−J/C(θ)).

          Remark (What the three parts leave open). Part (i) is one-sided twice
          over … The late-term restriction in (ii) is not cosmetic … Nor does (ii)
          give a single crossing … In (iii) the algebraic factor may not be
          absorbed into the exponential …
        explanation: |
          Nothing is deleted: every qualification survives, at the altitude A1
          assigns it. The proposition halves in length and states three relations
          among objects; the remark carries what the hypotheses fail to give.
          Two of the removed sentences also turned out to be duplicates of lines
          already in the proof, which only became visible once the material was
          sorted by altitude.

  - id: "A3_replacement_precondition"
    name: "Re-placement requires the citation set"
    one_liner: "A statement may not be relocated until what cites it is known; references address containers, not content, and the compiler checks neither."

    statement_natural: |
      Placement may be changed only after the citation set is known. References
      address containers rather than content: they name a label, or a number, or
      a part, or they span a range. So relocation can redirect a reference
      without touching it. A remark promoted to a proposition takes a new number;
      a clause moved from part (i) to part (ii) silently redirects everything
      that cited part (i); and a range reference covers whatever now lies between
      its endpoints, so reordering can sweep a third item into its scope while
      both endpoints, and the direction of the reference, stay exactly as they
      were.
      None of this is reported by a compiler, which resolves labels rather than
      meaning: a document with a citation pointing at the wrong object still
      builds with zero undefined references. The citation set is therefore a
      precondition of re-placement, not a check to run afterwards — afterwards
      there is nothing left that distinguishes a correct reference from a
      redirected one.

    statement_formal: |
      For a statement S, let
        Cites(S) := { r : target(r) = label(S) }  ∪  { r : S ∈ span(r) }
      where, for a range reference r = ⟨A, B⟩,
        span(r) = { X : pos(A) ≤ pos(X) ≤ pos(B) }              // order-dependent
      Admissibility of relocation:
        relocate(S, c_old → c_new) admissible  ⟺  Cites(S) known
                                                  ∧ (∀r ∈ Cites(S)) claim(r) holds of S at c_new
      Silence of the compiler:
        compiles(D) ∧ undefined(D) = ∅   ⊬   (∀r ∈ Refs(D)) claim(r) holds
      Order-immunity of explicit endpoints:
        span(⟨A, B⟩) varies under reordering;  {A} ∪ {B}  does not.

    rationale: |
      The failure mode is silent, which is what makes a precondition necessary
      rather than a checklist item. Every automated signal a writer normally
      trusts — zero undefined references, zero errors, an unchanged page count —
      is satisfied by a document whose citations have been redirected. And the
      cheapest defence is structural rather than procedural: a range reference
      is order-dependent, a pair of explicit endpoints is not, so writing
      "§A and §B" instead of "§A–§B" makes the question unnecessary.

    violations:
      - description: "Reordering three subsections silently widened a range reference; both endpoints unchanged, direction unchanged, compiler clean"
        content: |
          Text (unchanged by the edit):
            "for the explicit risk differences of §entire–§finite, the gap is
             exactly zero"
          Edit: the three regime subsections were reordered from
            entire → finite → zero   to   entire → zero → finite
          Result: the range now spans three subsections instead of two, sweeping
          in the zero-radius case, where r_D = 0 and the full sum does not exist.
        explanation: |
          The claim did not merely become false — it became undefined, since the
          quantity it asserts to be zero does not exist in the swept-in case. The
          line is context in the diff, not a changed line; a direction check on
          each reference passes; the build reports zero undefined references. Only
          knowing the citation set before reordering would have caught it.

    compliant:
      - description: "Citation set enumerated before relocating, and range references converted to explicit endpoints"
        content: |
          Before moving prop:superasymptotic's commentary:
            grep for \ref{prop:superasymptotic}      → 12 sites, all cite (i)/(ii)/(iii)
            grep for \ref{eq:superasymptotic_attain} →  1 site, inside the proof
            grep for \ref{eq:superasymptotic_floor}  →  0 sites
          Conclusion recorded before editing: the statement may be restructured
          freely provided the part numbering (i)/(ii)/(iii) is preserved.
          Separately: "§A–§B" rewritten as "§A and §B" wherever the two endpoints
          were the intended scope.
        explanation: |
          The citation set determines what the restructure must preserve — here,
          part numbering and nothing else — so the constraint is known before any
          text moves rather than discovered by a reader afterwards. Converting
          the range to explicit endpoints removes the order-dependence entirely,
          which is a stronger remedy than remembering to check it.

  - id: "A4_reading_order_dependence"
    name: "Dependence runs backward in reading order"
    one_liner: "A statement may lean only on what precedes it; a pointer ahead may say where, never use what."

    statement_natural: |
      A definition, proposition, remark or example may depend only on objects,
      results and numbers the reader has already met. The text is read in one
      direction, and at each point the reader holds exactly the prefix: a
      reference to something later cannot be checked when it is read, and a
      number quoted from later cannot be told apart from an assumption. Two kinds
      of forward pointer remain legitimate, and both are roadmap rather than
      dependence: a section overview announcing where a question will be
      treated, and a pointer from the place where a case is left open to the
      place where it is closed. What is prohibited is using the later material:
      invoking a later proposition as a step, quoting a later value, resting a
      bullet on a later corollary. The remedy is never to delete the dependence
      but to reorder: move the dependent statement after what it depends on, or
      split off the dependent sentence and place it where the cited result
      lives, so that it cites backward. Reordering is a re-placement, so A3
      applies: the citation set of what moves must be known before the move.

    statement_formal: |
      Let the document be the sequence S_1, …, S_N in reading order, and let
      Uses(S_i) be the set of statements whose content S_i invokes — as a step,
      a value, or a premise.
        Backward dependence:   ∀ i, ∀ S_j ∈ Uses(S_i):  j < i
        Roadmap exemption:     a pointer S_i → S_j with j > i is permitted
                               iff S_j ∉ Uses(S_i)   (it names a location and
                               supplies no content)
      Remedy — reorder, do not delete:  if S_j ∈ Uses(S_i) with j > i, then
        either  move S_i to a position i′ > j,
        or      split the dependent clause c ⊂ S_i off and place it at a
                position > j,
      subject to A3: the citation set of the moved statement is known first.

    rationale: |
      A forward dependence puts the reader where the author never stands. The
      author, holding the whole document, sees a closed chain; the reader,
      holding the prefix, sees a claim resting on nothing yet available, and a
      number quoted from a later example looks like an input rather than an
      output. Roadmap pointers escape because they transfer no content: the
      reader can carry on without them. The remedy must be reordering rather
      than deletion because the dependence is usually real and useful — the
      later result genuinely is what settles the point — so deleting it hides
      a true link, while reordering keeps the link and turns it backward. And
      because the fix moves statements, it is a re-placement: A3's precondition
      applies, and the compiler will not report a citation redirected by the
      move.

    violations:
      - description: "A remark placed after a theorem quotes a proposition from a later section and a number from a later example"
        content: |
          Remark 4.20 (The deficiency is defined on the scaled MSE). … the same
          equation MSE_I(J + d_J, θ) = MSE_*(J, θ) has the limit d = Δ₂/(2α₁),
          half the value of Theorem 4.19 … This is the case (m, k₀) = (2, 3) of
          Proposition 5.33. For the equal-difficulty Rasch model at P = 0.30 the
          exact truncated-binomial MSEs give −8.71 for the unscaled equation at
          J = 200, 400 and 800, against d(θ) = −17.43 from Example 4.26.
        explanation: |
          Proposition 5.33 lives a section later and Example 4.26 six items
          later, and the remark uses both as content: one as the general case
          the remark instantiates, the other as the number it compares against.
          A reader at 4.20 holds neither, so the comparison cannot be checked
          when read and −17.43 reads as an assumption. In the same revision
          Definition 4.16 pointed ahead to Remark 4.20, and the central bullet
          of Example 4.26 quoted d(b) = −121/18 from a corollary a section later.
          (PB-of-IRT-ability manuscript §4.5, 2026-09-02, commit 5a7a905.)

    compliant:
      - description: "The same content reordered so that every dependence points backward; the roadmap pointer is kept"
        content: |
          Example 4.25 (Equal-difficulty Rasch instantiation …). … d(θ) = 4 − 9/(2u),
          equal to −17.4, −24.1 and −46.0 at P = 0.30, 0.20 and 0.10 …
          Remark 4.26 (The deficiency is defined on the scaled MSE). … d = Δ₂/(2α₁),
          half the value of Theorem 4.19 … the exact truncated-binomial MSEs give
          −8.71 … against d(θ) = −17.43 from Example 4.25.
          [§5.7.1] Remark (The unscaled MSE as a shift of orders). Remark 4.26 is
          the case (m, k₀) = (2, 3) of Proposition 5.33: …
          Corollary 4.24 (unchanged). Where α₁(θ) = 0 the ratio is undefined;
          Proposition 5.33 extends the deficiency to that case.
        explanation: |
          The remark now follows the example it quotes, so −17.43 is a value the
          reader has derived; the sentence instantiating Proposition 5.33 moved
          to §5.7.1 and cites backward; the example's bullet points back to the
          corollary's note instead of ahead to the later corollary's value. The
          corollary's own pointer ahead is kept: it names where the α₁ = 0 case
          is closed and uses nothing from there — roadmap, not dependence. Each
          move was made after listing what cited the moved statement (A3).
          (Same manuscript, commit 3840bee.)

  - id: "A5_motivated_by_prefix"
    name: "Each element is called for by what precedes it"
    one_liner: "An article is read in order, not checked item by item: a concrete example, a definition or a result arrives only after the reader holds the question it answers."

    statement_natural: |
      A manuscript is read in sequence, so being correct is not enough: each
      element must also be called for by what the reader has already read. When
      the reader reaches a concrete example, a definition, a notation or a
      result, the preceding text must already have raised the question it
      answers or the need it meets. An element that arrives before its question
      breaks the flow even when every number in it is right and it depends on
      nothing later: the reader has to hold it without knowing what it is for,
      and to reconstruct afterwards why it was there. Concrete examples are the
      commonest case, because an example is the answer to "does this matter?" or
      "what does this look like?", and that question has to be asked first. The
      remedy is to reorder, or to write the transition that raises the question:
      state the choice, the claim or the gap, then bring the element in as the
      answer, saying in the sentence that introduces it which question it
      answers. A4 governs what an element may use; this axiom governs when it
      may appear. An element can satisfy either one and still violate the other.

    statement_formal: |
      Let S_1, …, S_N be the document in reading order, let E ⊆ {1, …, N} be
      the positions of its elements (concrete examples, definitions,
      notations and results; a sentence that raises a question, a transition
      or a statement of the setting is not an element), and for i ∈ E let
      Q(S_i) be the question or need S_i answers: for an example, the claim it illustrates or
      the doubt it settles; for a definition or notation, the object the next
      statements must name; for a result, the question it settles.
        Motivated:   ∀ i ∈ E,  ∃ j < i  such that S_j raises Q(S_i)
                     (S_j states the choice, claim or gap that Q(S_i) names)
        Announced:   ∀ i ∈ E,  S_i itself, or the sentence just before it in
                     the same paragraph, names Q(S_i); or S_i immediately
                     follows the S_j that raises it.
      Independence from A4:
        A4 constrains Uses(S_i) (content invoked);  A5 constrains Q(S_i)
        (purpose served). An S_i with Uses(S_i) ⊆ {S_j : j < i} can still
        violate A5, and an S_i whose question is raised beforehand can still
        violate A4.
      Remedy — reorder or write the transition, do not delete:
        if no j < i raises Q(S_i), then
        either  move S_i after the S_j that raises Q(S_i),
        or      insert before S_i a sentence that raises Q(S_i),
      subject to A3 when anything moves.

    rationale: |
      The author knows why each element is there, so an element that comes too
      early looks fine to the author: it is correct, it depends on nothing later
      (A4 passes), and its purpose becomes clear a page later. The reader, who
      holds only the prefix, meets the element without its purpose and has to
      park it. Item-by-item checks (is this true, is this cited, does this
      depend on later material) cannot see the defect, because the defect is a
      property of the sequence, not of any item. That is why it needs its own
      axiom rather than a clause of A4. The remedy is reordering or a
      transition rather than deletion, because the element is usually worth
      having: a concrete example is often what makes the abstract claim
      believable, and it does that best right after the claim is made.

    violations:
      - description: "A worked example opens the section before the reader knows what question it answers"
        content: |
          ¶1. Consider n = 10 independent draws whose squared deviations from
          the sample mean sum to 36. Dividing by n gives 3.6; dividing by n − 1
          gives 4.0.
          ¶2. The first is the maximum-likelihood estimate of the variance
          under a normal model; the second is unbiased. …
        explanation: |
          ¶1 opens the section on a specific sample of ten draws and a sum of
          36 before the reader knows there is a choice between two divisors,
          so the reader has no reason yet to care about these numbers. The
          estimators the numbers belong to are named only in ¶2, so the
          example carries the setting instead of answering a question the
          setting raised. Every number is correct and nothing
          depends on later material: A4 is satisfied and the passage still
          breaks the flow. (The example is constructed for this axiom; it is
          not taken from a manuscript.)

    compliant:
      - description: "The choice and the question come first; the example arrives as the answer to 'does the choice matter?'"
        content: |
          ¶1. The sum of squared deviations can be divided by n, for the
          maximum-likelihood estimate of the variance under a normal model, or
          by n − 1, for an unbiased one. For large n the choice hardly matters;
          for small n it might.
          ¶2. For ten draws it already does: with squared deviations summing
          to 36, the two divisors give 3.6 and 4.0.
        explanation: |
          ¶1 states the choice and raises the question (does it matter for
          small n?). ¶2 opens with the clause that answers that question and
          then gives the numbers. The example is the same, and so are its numbers; only its
          position and its first sentence change.

  - id: "A6_prior_result_attribution"
    name: "A result already in the literature is cited, not claimed as new"
    one_liner: "Before a result is presented as the manuscript's own, the literature is searched for it; a source that already proves the result, proves a part of it, is a short step from it, or states it without proof is cited at the statement with what it has, and the manuscript claims only what goes beyond it."

    statement_natural: |
      A result the author has derived looks new to the author, whether or not
      it is. So before a manuscript presents a result as its own, the author
      searches the literature for it, compares what is found with the result,
      and writes the outcome at the result.

      Terms. The manuscript's result has settings (the models, parameter
      values and assumptions under which it is asserted) and a conclusion.
      A source is any citable work: an article, a book, a thesis, a preprint
      or a report. A published result is a statement that a source proves;
      what a source derives formally or heuristically, conjectures, or shows
      numerically, or asserts without proof is not a published result and
      falls under (P4) below. The unit that gets a case is one published
      result, or one such unproved item: a source that contains several is
      compared item by item. Several published results may also be compared
      together; putting them side by side with "and" is not a step, while
      chaining them is a further argument. When a set compared together
      gives (K), that is the case of the manuscript's result, and it
      replaces the kinds found for the members one by one; each member is
      still cited.

      Comparison. A published result is compared with the manuscript's result
      after an explicit translation: the map of notation, units, scale and
      parametrization under which the two are stated in the same terms. A
      translation renames and rescales; it uses no theorem. Carrying a limit
      law or an expansion through a nonlinear change of parameter uses the
      delta method and is a further argument. A statement follows
      immediately from a published result when it is
      obtained from the translated result by steps of four kinds only (a
      closed list). Anything else, however short, is a further argument:
      applying another theorem or inequality, summing or integrating,
      differentiating, taking a limit, algebra that cannot be reversed.
        (d1) choosing values of its parameters and evaluating its
             expressions at them;
        (d2) restricting its model or its assumptions to a special case;
        (d3) rearranging its conclusion by reversible algebra (solving for a
             quantity, multiplying by a nonzero known factor, taking a root
             or a logarithm of positive quantities);
        (d4) weakening its conclusion in one of nine ways (a closed
             list of standard weakenings, used without proof): from several
             assertions to one of them; from joint convergence to marginal
             convergence; from convergence with an error of a stated order
             to convergence; from a limit law at a scale r_n that diverges
             to an error of order 1/r_n in probability and to convergence
             in probability; from almost sure convergence to convergence in
             probability, and from that to convergence in distribution;
             from convergence in mean of order p to convergence in
             probability; from an expansion to its leading terms; from an
             exact value to a bound; from a bound or an error order to a
             larger one.
      The check that the manuscript's setting satisfies the published
      assumptions is not a step. It may use the manuscript's own lemmas and
      may be long; the case is decided by the steps, not by the check.
      What follows from what is judged on the statements, not on how their
      assumptions are worded or listed.

      The cases. For each published result or unproved item, and for each
      set compared together, they are tested in this order and the first
      that holds is the case, so exactly one holds.
        (K) Known. The manuscript's result follows immediately from the
            published result. An identical result is the case in which no
            step is needed.
        (P) Partly known. (K) fails and one of four kinds holds (a closed
            list; "similar" is not a fifth). The kinds are also tested in
            order, and the first that holds is the kind.
            (P1) A case. The published result immediately gives the
                 manuscript's result on some, but not all, of its settings.
                 A published special case is of this kind, and so is a
                 published result with the same or a stronger conclusion
                 under assumptions that overlap the manuscript's without
                 covering them.
            (P2) A weaker form. On all or some of the settings, the
                 published result immediately gives a statement to which
                 the manuscript's conclusion weakens by (d4): one of its
                 assertions, its leading term, a bound or an error order it
                 sharpens, convergence where it gives an error order or a
                 limit law.
            (P3) A short step. The manuscript's result is obtained from the
                 published conclusion, or from several published
                 conclusions together, by a further argument short enough
                 to be written out in one paragraph. This is judged on
                 whether the author knows such an argument, not on how the
                 manuscript's own proof goes. When it is unclear whether
                 one paragraph suffices, (P3) is taken to hold.
            (P4) Stated, not proved. The source contains, without a
                 proof of it, the manuscript's statement or a statement
                 that would give (K), (P1) or (P2) if the source proved it
                 (a case, a weaker form or a stronger form of the
                 manuscript's statement); or it contains the formula,
                 expression or procedure that the result is about, or a
                 general one from which it is obtained by (d1) to (d3).
                 What the source gives is not a proof of the manuscript's
                 statement: a
                 conjecture, an assertion without proof, a formal or
                 heuristic derivation, an expansion with no control of its
                 remainder, numerical evidence, or a proof for a different
                 quantity that has the same expression. A different
                 quantity is one defined differently, even when the two are
                 related: the variance of a limit law and the limit of a
                 variance, or the same estimator under another model.
        (U) Unrelated. Neither (K) nor (P) holds. The source is then not
            presented as a source of the result. It may be discussed as
            related work. A published result that the manuscript's proof
            uses at one of its steps, with (P3) failing, is in this case:
            it is cited at that step, as any tool is.
      One rule holds whatever the case. When the author suspects that a
      short argument leads from a published result to the manuscript's
      result and has not found one, the source is cited at the statement as
      closely related, and the manuscript says that the step from it was
      not found.

      What the manuscript writes. Under (K) and (P) it writes four things:
        (w1) the citation, with a locator (theorem, equation or page);
        (w2) the case and the kind, said in the manuscript's own words
             ("is known", "is the case ... of", "the first assertion is due
             to", "follows from ... by", "the formula appears in ... as a
             formal expansion"); the labels K and P1 to P4 belong to this
             axiom, not to the manuscript;
        (w3) the translation, when the two are not stated in the same terms;
        (w4) under (K), the steps that give the result, with the check that
             the manuscript's setting satisfies the published assumptions;
             under (P), what the source has and what the manuscript adds.
      (w1) may stand in the heading of the theorem-like environment, as in
      "Theorem 2 ([source], Theorem 3)". (w2) to (w4) stand in the sentence
      that introduces the environment or in a remark after it, not in its
      body: an attribution is not part of the mathematical statement (A1).
      A check or a translation too long for that place stands in a section
      or an appendix, and the sentence or remark points to it. A result
      stated in running text carries them in the same paragraph.
      What the abstract and the list of contributions say about the result
      agrees with them. Written before the environment, (w4) says where the
      statement that follows stands in the literature and uses nothing from
      it, so the condition of A4 is met. If applying this axiom moves or
      renumbers a statement, A3 applies.

      What may be claimed, and what is proved.
        Under (K) the result is attributed to the source and is not among
        the manuscript's contributions. It may stay in a numbered
        environment or be stated in the text. Its proof may be omitted;
        (w4) then stands in its place. A proof that is kept, for
        self-containedness or because the proof is new, is labelled as a
        proof of a known result; a new proof may be claimed as a
        contribution under that name only. When the check of assumptions
        needs results of its own, those are results of the manuscript and
        are claimed as what they are: the verification that the published
        result applies in the manuscript's setting. (w2) then reads
        "follows from ..., once its assumptions are verified", not "is
        known".
        Under (P1) and (P2) the published part may be cited instead of
        proved, with the same check of assumptions; the manuscript proves
        what the published part does not give and claims only that. When
        the published form is a weakening of the whole conclusion, that is
        the whole result as stated, and what is claimed is what the result
        asserts beyond the published form.
        Under (P3) the manuscript writes out the short argument from the
        published conclusion, with the same check of assumptions, so that
        the reader sees that the result is one step from the source. It may
        keep its own independent proof beside that argument. What it claims
        is the step, or the alternative proof as a proof, not the result as
        new.
        Under (P4) that source is not cited in place of a proof. The
        statement or the formula is attributed to it. When no other source
        proves the statement, the manuscript proves it in full and claims
        the proof: the statement as a proved one, and the statement itself
        where the source has only the formula.
      When several units bear on one result, each is written up in this
      way, and the duties combine. For claims: the manuscript claims as new
      only what goes beyond all of them. For proofs: a part of the result
      may be cited in place of proving it when some unit with case (K), or
      kind (P1) or (P2), proves that part, and the manuscript proves what
      no such unit proves. When some unit gives (K), the short argument of
      (P3) need not be written out.

      The search. It is the author's duty. It is done before a result is
      presented as the manuscript's own: stated without attribution in a
      theorem-like environment or in the text as a result the manuscript
      derives, listed as a contribution, or called new anywhere. The minimum is these three things (more may
      be done):
        (s1) the textbooks, monographs and surveys that the author would
             name as the standard references of the field, whether or not
             the manuscript cites them yet: their chapters or sections on
             the topic, found from the contents and the index; the note
             below names the works and the sections;
        (s2) the works the manuscript cites on the topic, and the source
             each of them gives for each ingredient of the result, one
             level back;
        (s3) one bibliographic index that also lists preprints and theses,
             or one index and one preprint server, queried by the names
             under which the result would be known and by the distinctive
             terms of its statement, over all works and then over the works
             that cite the closest source found in (s1) and (s2); for each
             query the first page of results is read by title and abstract.
      For an auxiliary lemma that the manuscript does not list as a
      contribution, (s1) and (s2) are enough. The author keeps a note of
      what was searched (the works, the index, the queries, the date). The
      note is not part of the manuscript; it is what shows that the duty
      was met, and the duty is met when the three things are done and
      noted. When the search finds nothing, the
      manuscript may present the result as its own, and a statement that no
      earlier source exists is worded as the author's knowledge ("to our
      knowledge"), because a search does not establish absence. A result
      that the author knows to be in standard use in the field is said to
      be well known when the search finds no source that proves it. A
      source that states it without proof is cited; when there is none, the
      manuscript remarks that no reference was found. The result is not
      claimed as new, and neither is its proof; a proof may be given for
      the record. This takes precedence over the claim allowed under (P4).

    statement_formal: |
      Let R be a result of manuscript M, with settings Set(R) and conclusion
      Concl(R). Let R' be a published result (a statement proved in a
      source), or the conjunction of finitely many, and τ the translation of
      R' into the terms of M. Let F be an item in a source that is not a
      published result (a conjecture, an assertion without proof, a formal
      derivation, numerical evidence). The case is assigned to each R', each
      F and each set of results compared together; K for a set replaces the
      kinds of its members.
        τ(R') ⊢ S   ⇔  S is obtained from τ(R') by steps (d1)–(d4) only.
        K(R, R')    ⇔  τ(R') ⊢ R.
        P1(R, R')   ⇔  ∃ A, ∅ ≠ A ⊊ Set(R):  τ(R') ⊢ R restricted to A.
        P2(R, R')   ⇔  ∃ A, ∅ ≠ A ⊆ Set(R), ∃ W ≠ Concl(R):  Concl(R)
                        weakens to W by (d4), and τ(R') ⊢ W on A.
        P3(R, R')   ⇔  the author knows an argument of at most one
                        paragraph from Concl(τ(R')) to R that is not a chain
                        of (d1)–(d4); unclear whether one paragraph suffices
                        ⇒ P3.
        P4(R, X)    ⇔  X ∈ {R', F}, and X is F or is a proved statement
                        about a different quantity, and X contains the
                        statement of R, or a statement that would give K, P1
                        or P2 if X proved it, or the formula, expression or
                        procedure that R is about, or one that gives it by
                        (d1)–(d3).
        case        =  K if K;  else P with kind the first of P1, P2, P3, P4
                        that holds;  else U.
      Exactly one case, and under P exactly one kind, holds for each unit,
      by construction. A further argument is any derivation that is not a
      chain of (d1)–(d4). The check Setting(M) ⊨ Hyp(R') is not a step. τ
      renames and rescales and uses no theorem.
      Suspected:    in every case, if the author suspects an argument of at
                    most one paragraph from Concl(τ(R')) to R and knows
                    none, M cites R' at the statement as closely related and
                    says that the step was not found.
      Search:       ∀ R that M states without attribution in a theorem-like
                    environment or in the text as a result it derives, lists
                    as a contribution or calls new:
                    before R is so presented the author has done (s1)–(s3)
                    ((s1)–(s2) for an auxiliary lemma not listed as a
                    contribution) and keeps the note of it.
      Nothing found: M may present R as its own; "no earlier source" is
                    stated only as the author's knowledge. In standard
                    use and proved in no source found  ⇒  M says that R is
                    well known, cites a source that states it if there is
                    one, and neither R nor its proof ∈ Contributions(M);
                    this overrides the claim under P4.
      Writing:      K ∨ P  ⇒  M gives (w1) in the heading of the environment
                    or beside it, and (w2)–(w4) beside it, outside its body.
      Attribution:  K  ⇒  M attributes R to R'  and  R ∉ Contributions(M);
                          a new proof of R may be in Contributions(M) as a
                          proof of a known result.
                    P4 ⇒  M attributes the statement or the formula to X.
      Proof:        K   ⇒  M may omit the proof of R, and (w4) stands in its
                           place; a proof that is kept is labelled as a
                           proof of a known result.
                    P1, P2  ⇒  M may cite the published part in place of
                           proving it, with the check of assumptions.
                    P3  ⇒  M gives the short argument from Concl(R'), with
                           the check of assumptions, unless some unit gives
                           K; it may keep an independent proof beside it.
                    P4  ⇒  X is not cited in place of a proof.
                    all units together  ⇒  M proves every part of R that no
                           unit with K, P1 or P2 proves.
      Novelty:      what M claims as new about R  ⊆  ⋂ New(R, X) over all
                    sources with K or P, where New(R, X) is: nothing under
                    K, apart from results of M used in the check of
                    assumptions; R outside the published part under P1 and
                    P2; the step, or an alternative proof as a proof, under
                    P3; under P4 the proof, and the statement where X has
                    only the formula.
      Closure:      U  ⇒  X is not presented as a source of R; it may be
                          discussed as related work; a result used at a step
                          of the proof is cited at that step.

    rationale: |
      The order of work produces the defect. The author derives first and
      searches afterwards, if at all, and a derivation done independently
      feels like a discovery. A referee who knows the literature then finds a
      known result presented as a contribution and reads the rest of the
      manuscript with less trust; meanwhile the part that is new is buried
      among results that are not. Citing costs the author little: under (K)
      the check of assumptions can replace a proof, the pages go to what is
      new, and the reader is told how the manuscript's notation maps onto
      the literature's, which is what makes the two comparable. The cases
      and the kinds are tested in a fixed order because "similar" is a
      judgment made by feel, and the feel is wrong in both directions: it
      lets an author skip a result that is the same in other notation, and
      it lets an author cite a neighbouring paper as if it carried the
      result. Immediate derivation is defined by its steps because the
      alternative, comparing how the assumptions are listed, lets one pair
      of results fit two cases with opposite duties. (P3) is judged on
      whether the author knows a short argument, not on the manuscript's
      proof,
      because the author who has not seen the source proves the result
      independently, and that is the case this axiom is for. What may be
      cited in place of a proof differs by kind because a formal derivation
      or a conjecture proves nothing. The search has a stated minimum and a
      note because without them the duty can never be shown to have been
      met.
      Occasion (2026-11-24): a coefficient that an author had derived, and
      proved as part of a lemma, was found by a literature sweep run after
      drafting to be the value, at the manuscript's model, of a term in a
      general expansion published more than a decade earlier. The published
      expansion is a formal one, for a related quantity; the lemma is a
      statement with a controlled remainder. That is kind (P4): the formula
      is attributed, and the lemma is claimed as a proved statement. The
      sweep was run
      because the author asked whether anything had been missed, not
      because the workflow required it. An earlier draft of this axiom
      listed four relations (same, more general, special case, same
      conclusion under different assumptions); an independent reading
      showed that an identical result fitted three of them, that one pair
      could fit two with opposite duties, and that the occasion itself
      fitted none.

    violations:
      - description: "A textbook result is stated as the manuscript's own and proved from scratch"
        content: |
          Proposition 1. Suppose √n (T_n − θ) converges in distribution to
          N(0, σ²) and g is differentiable at θ. Then √n (g(T_n) − g(θ))
          converges in distribution to N(0, g′(θ)² σ²).
          Proof. (One page.) …
          In Section 6 we list Proposition 1 among our contributions.
        explanation: |
          Proposition 1 is the delta method. Against a textbook statement
          that covers it, it is case (K). The manuscript gives no citation,
          proves it in full with no label, and counts it as a contribution.
          A reader who knows the result now doubts the other items on that
          list. (The example is constructed for this axiom; it is not taken
          from a manuscript.)

    compliant:
      - description: "Case (K): the known result keeps its number, is attributed in the heading, and the check of assumptions replaces the proof"
        content: |
          Proposition 1 is known: it is the delta method, in the case of a
          real-valued map and the rate √n. Its assumptions hold in our
          setting, since g is differentiable at θ and √n (T_n − θ) converges
          in distribution to N(0, σ²) by Lemma 2. We state it for reference
          and do not repeat the proof.
          Proposition 1 ([textbook], Theorem [number]). √n (g(T_n) − g(θ))
          converges in distribution to N(0, g′(θ)² σ²).
        explanation: |
          (w1) is in the heading; the bracketed reference stands for
          whichever textbook the manuscript uses, because the example is
          constructed. (w2) "is known ... in the case of". (w3) is not
          needed: the two are stated in the same terms. (w4) the steps are
          (d1), the rate, and (d2), the real-valued map, and the assumptions
          are checked against Lemma 2. The proposition keeps its number, has
          no proof, and is not among the manuscript's contributions.
      - description: "Kind (P2): the published weaker form is named and what the manuscript adds is stated before the theorem"
        content: |
          Convergence of the estimator to θ in probability under (A1) and
          (A2) is known ([source], Theorem [number]). Theorem 1 adds the
          rate √n and the limit law, for which (A3) is used.
          Theorem 1. Under (A1), (A2) and (A3), √n (θ̂_n − θ) converges in
          distribution to N(0, v(θ)).
        explanation: |
          The source gives convergence in probability under (A1) to (A3) by
          step (d2). The conclusion of Theorem 1 weakens to it by (d4), from
          a limit law at the scale √n to convergence in probability, so the
          kind is (P2); (K) and
          (P1) fail because the source gives the limit law on no setting.
          The sentences before the theorem carry the citation, the kind
          ("is known ... Theorem 1 adds") and what is added; no translation
          is needed. Theorem 1 is proved in full, and its contribution is
          the rate and the limit law, not the convergence. (The example is
          constructed for this axiom.)

theorems:
  - id: "T1_negative_space_is_meta"
    name: "Claims about what a hypothesis does not give are meta-level"
    derives_from: ["A1_altitude_placement"]

    statement_natural: |
      A claim that a hypothesis does not yield a conclusion is meta-level. Its
      subject is the hypothesis and its entailments, not the objects the theory
      is about, so by A1 it belongs in a remark rather than in the statement of
      the result that assumes the hypothesis.
      This holds even when the claim is the most substantial mathematics in the
      neighbourhood. A counterexample witnessing that H does not entail C is a
      genuine construction and may be harder to find than the result itself; it
      is still meta-level, because what it is about is H. Placing it in the
      statement makes the result appear to assert its own limitation, and makes
      the reader carry a negation through the very hypothesis they are being
      asked to assume.

    statement_formal: |
      S asserts  H ⊬ C   (equivalently: ∃ a model of H in which C fails)
        ⟹  subject(S) = H ∈ Theory,  not  Obj(T)
        ⟹  level(S) = meta                                   [primitive: Meta-level]
        ⟹  container(S) = Remark                             [A1]
      In particular, for a witness W with  W ⊨ H  and  W ⊭ C :
        place(W) = Remark,  not  statement(result assuming H).

    violations:
      - description: "A counterexample to a stronger reading placed inside the proposition that assumes the hypothesis"
        content: |
          Proposition (ii). If the coefficients obey (5.11), then t_k(J) attains
          its minimum over k ≥ k_LT at an order J/C(θ) + o(√J) … What (5.11) does
          not give is a single crossing. It is an asymptotic equivalence and
          constrains no smoothness, so |Δ_k(θ)| = A C^k Γ(k+β)(1 + (−1)^k k^{−1/4})
          satisfies it while t_{k+1}/t_k crosses one repeatedly across a window of
          width Θ((J/C(θ))^{3/4}). The terms fall before that window and rise
          after it, without being monotone inside.
        explanation: |
          The witness is real mathematics and was worth finding — it is what
          forced the localisation claim down from O(1) to o(√J). But its subject
          is (5.11), not the coefficients of any particular comparison, so it is
          meta-level. Inside the statement it reads as the proposition disowning
          itself mid-assertion.

    compliant:
      - description: "Statement asserts what the hypothesis gives; the adjacent remark carries what it does not"
        content: |
          Proposition (ii). Let k_LT be an index beyond which Δ_k(θ) ≠ 0. For all
          J large, t_k(J) attains its minimum over k ≥ k_LT at an order
          J/C(θ) + o(√J), of size exp(−J/C(θ)) up to an algebraic factor.

          Remark (What the three parts leave open). … Nor does (ii) give a single
          crossing. Since (5.11) is an asymptotic equivalence and constrains no
          smoothness, the sequence |Δ_k(θ)| = A C^k Γ(k+β)(1 + (−1)^k k^{−1/4})
          satisfies it while t_{k+1}/t_k crosses one repeatedly across a window of
          width Θ((J/C(θ))^{3/4}): the terms fall before that window and rise
          after it, without being monotone inside.
        explanation: |
          The proposition states a relation among the objects; the remark states a
          property of the hypothesis. The witness loses nothing by moving — it is
          still displayed in full, one paragraph later — and the reader is no
          longer asked to hold an assertion and its limitation in the same breath.
