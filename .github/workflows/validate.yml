name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest JSON validity
        run: |
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . plugins/che-axiom-systems/.claude-plugin/plugin.json > /dev/null
          echo "both manifests are valid JSON"

      - name: Version sync (marketplace.json == plugin.json)
        run: |
          MV=$(jq -r '.plugins[] | select(.name == "che-axiom-systems") | .version' .claude-plugin/marketplace.json)
          PV=$(jq -r '.version' plugins/che-axiom-systems/.claude-plugin/plugin.json)
          if [ "$MV" != "$PV" ]; then
            echo "::error::version drift — marketplace.json=$MV plugin.json=$PV"
            exit 1
          fi
          echo "versions in sync: $MV"

      - name: Skills frontmatter lint
        run: |
          # Guard on the actual requirement, not on apt/pip succeeding: PyYAML is
          # already on the runner image, and a bare `apt-get || pip` compound can
          # red this step for a reason that has nothing to do with any skill file.
          python3 -c 'import yaml' 2>/dev/null \
            || sudo apt-get install -y python3-yaml > /dev/null 2>&1 \
            || pip install pyyaml > /dev/null
          python3 - <<'EOF'
          import glob, os, re, sys, yaml

          # The frontmatter must PARSE, not merely contain lines that look like
          # `name:` and `description:`. The previous version of this step used
          # `grep -q '^name:'` / `grep -q '^description:'` on raw text, so 11
          # skills whose description contained an unquoted `: ` — which
          # terminates a YAML plain scalar and makes the whole block a parse
          # error — passed CI green while being unloadable (#29 verify).
          #
          # That is the same defect class this repo's 四件套 rule exists to
          # prevent: a check that looks like it guards something it never
          # inspects. Parse it. And parsing is not enough either — a green run
          # must also prove it INSPECTED something (empty glob below) and that
          # what it parsed is loadable by the skill loader, not merely truthy
          # (type/length/slug checks below). #29 verify round 2.
          NAME_RE = re.compile(r"^[a-z0-9]+(-[a-z0-9]+)*$")
          MAX_NAME, MAX_DESC = 64, 1024

          fail = False
          files = sorted(glob.glob("plugins/che-axiom-systems/skills/*/SKILL.md"))

          # An empty glob is NOT a pass. A renamed path or a deleted tree would
          # otherwise produce a green run identical to a fully-checked one.
          if not files:
              print("::error::skills glob matched no SKILL.md — the lint inspected nothing")
              sys.exit(1)

          for f in files:
              slug = os.path.basename(os.path.dirname(f))
              text = open(f, encoding="utf-8").read()
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  print(f"::error file={f}::missing or malformed frontmatter delimiters")
                  fail = True
                  continue
              try:
                  fm = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  detail = str(e).replace("\n", " ")[:200]
                  print(f"::error file={f}::frontmatter is not valid YAML: {detail}")
                  print(f"::error file={f}::hint — an unquoted ': ' inside a value "
                        f"ends the scalar; wrap the value in double quotes")
                  fail = True
                  continue
              if not isinstance(fm, dict):
                  print(f"::error file={f}::frontmatter must be a mapping")
                  fail = True
                  continue
              # Truthiness is not the contract: a list or an int is truthy and
              # would sail through, then be rejected by the skill loader.
              for key, cap in (("name", MAX_NAME), ("description", MAX_DESC)):
                  v = fm.get(key)
                  if v is None or (isinstance(v, str) and not v.strip()):
                      print(f"::error file={f}::missing or empty {key}:")
                      fail = True
                  elif not isinstance(v, str):
                      print(f"::error file={f}::{key}: must be a string, got {type(v).__name__}")
                      fail = True
                  elif len(v) > cap:
                      print(f"::error file={f}::{key}: is {len(v)} chars, exceeds {cap}")
                      fail = True
              name = fm.get("name")
              if isinstance(name, str) and name.strip():
                  if not NAME_RE.match(name):
                      print(f"::error file={f}::name '{name}' is not a lowercase-hyphen slug")
                      fail = True
                  if name != slug:
                      print(f"::error file={f}::name '{name}' != directory '{slug}'")
                      fail = True

          print(f"checked {len(files)} skills")
          sys.exit(1 if fail else 0)
          EOF

      - name: Domain manifests + INDEX + trigger surface + entry tables
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || sudo apt-get install -y python3-yaml > /dev/null 2>&1 \
            || pip install pyyaml > /dev/null
          python3 - <<'EOF'
          import glob, os, re, sys, yaml

          root = "plugins/che-axiom-systems/domains"
          skills_root = "plugins/che-axiom-systems/skills"
          fail = False

          if not os.path.isdir(root):
              print(f"::error::{root} does not exist — this check inspected nothing")
              sys.exit(1)

          domains = sorted(
              d for d in os.listdir(root)
              if os.path.isdir(os.path.join(root, d))
          )
          if not domains:
              print(f"::error::no domain directories under {root} — this check inspected nothing")
              sys.exit(1)

          # every domain has a valid manifest with required fields
          for d in domains:
              mf = os.path.join(root, d, "domain.yaml")
              if not os.path.isfile(mf):
                  print(f"::error::{d}: missing domain.yaml")
                  fail = True
                  continue
              m = yaml.safe_load(open(mf))
              for field in ("domain", "description", "format", "maturity", "entry_points"):
                  if field not in m:
                      print(f"::error file={mf}::missing field {field}")
                      fail = True
              if m.get("domain") != d:
                  print(f"::error file={mf}::domain field '{m.get('domain')}' != dir name '{d}'")
                  fail = True
              if m.get("format") not in ("yaml", "markdown", "freeform"):
                  print(f"::error file={mf}::invalid format {m.get('format')}")
                  fail = True
              if m.get("maturity") not in ("bootstrapped", "legacy"):
                  print(f"::error file={mf}::invalid maturity {m.get('maturity')}")
                  fail = True

          # INDEX.md lists exactly the domains that exist
          index = open(os.path.join(root, "INDEX.md")).read()
          for d in domains:
              if f"`{d}`" not in index:
                  print(f"::error::domains/INDEX.md missing entry for {d}")
                  fail = True

          # 四件套 #4 (#29): every domain has a trigger-surface skill. No exemption.
          # An earlier revision allowed `trigger_surface: none` plus a free-text reason;
          # #29 verify round 3 exempted a 23-axiom domain with the reason "x" and CI
          # stayed green. A gate whose only condition is that a human wrote *something*
          # is a human review step wearing a CI badge, so the hatch is gone.
          for d in domains:
              sk = os.path.join(skills_root, d, "SKILL.md")
              if not os.path.isfile(sk):
                  print(f"::error::{d} has no trigger surface — expected {sk}")
                  fail = True

          # ---- entry tables: rows resolve, and the declared coverage recomputes ----
          #
          # Round 2 found a row citing a section existing in no file. Round 3 found the
          # check written for that could pass having inspected nothing, and that the
          # hand-written counts beside those tables were wrong three times over — a
          # green run proved rows existed *somewhere*, never that the prose was true.
          # So the counts are no longer prose: each skill declares its sources in a
          # fixed line and CI recomputes N, M and N-M. Deleting a row, miscounting, or
          # attributing a row to the wrong file all break the arithmetic.
          FENCE = re.compile(r"^\s*(```|~~~)")
          COV = re.compile(
              r"^- `(?P<path>[^`]+)` · (?P<kind>id|h2|h3|h4) · 篩選 `(?P<filt>[^`]*)` — "
              r"共 \*\*(?P<n>\d+)\*\* 條，上表 \*\*(?P<m>\d+)\*\* 條，未列 \*\*(?P<k>\d+)\*\* 條\s*$",
              re.M,
          )

          def md_headings(text, lvl):
              """Headings at one level, outside fenced code. A fence can hold an
              illustrative `# Foo`, which is not a citable section."""
              out, infence = [], False
              for line in text.splitlines():
                  if FENCE.match(line):
                      infence = not infence
                      continue
                  if infence:
                      continue
                  m = re.match(r"^(#{1,6})\s*(.+?)\s*$", line)
                  if m and len(m.group(1)) == lvl:
                      out.append(m.group(2).strip())
              return out

          def yaml_ids(text, path):
              """id VALUES, structurally. A regex over raw text also picks up YAML
              comments and the inside of block scalars, where anyone can write
              `id: anything` without declaring an entry."""
              try:
                  doc = yaml.safe_load(text)
              except yaml.YAMLError:
                  print(f"  note: {path} does not parse; falling back to a text scan for its ids (see #31)")
                  return re.findall(r"^\s*-?\s*id:\s*[\"']?([A-Za-z0-9_.-]+)", text, re.M)
              found = []
              def walk(node):
                  if isinstance(node, dict):
                      v = node.get("id")
                      if isinstance(v, str):
                          found.append(v)
                      for x in node.values():
                          walk(x)
                  elif isinstance(node, list):
                      for x in node:
                          walk(x)
              walk(doc)
              return found

          def strip_lead(h):
              return re.sub(r"^[^\w一-鿿]+", "", h).strip()

          def head_ok(cited, pool):
              """Exact match, or a prefix cut at a parenthesised / dashed gloss, on the
              heading as written or with a leading emoji run removed. Substring matching
              is too loose: it accepts 〈Metalogic〉 against "Metalogical Results" — the
              exact fabrication this check exists for."""
              for x in pool:
                  for cand in (x, strip_lead(x)):
                      if cited == cand:
                          return True
                      for sep in (" (", "（", " ——", " —"):
                          if cand.startswith(cited + sep):
                              return True
              return False

          rows_checked = 0
          # A skill is domain-bound iff domains/<slug>/ exists, so adding a core helper
          # skill does not demand an entry table it has no reason to have.
          for sk in sorted(glob.glob(os.path.join(skills_root, "*", "SKILL.md"))):
              d = os.path.basename(os.path.dirname(sk))
              if not os.path.isdir(os.path.join(root, d)):
                  continue
              text = open(sk, encoding="utf-8").read()
              a, b = text.find("本域現有條目"), text.find("## 邊界")
              if a < 0 or b < 0:
                  print(f"::error file={sk}::expected a 本域現有條目 table and a ## 邊界 section")
                  fail = True
                  continue
              if b < a:
                  # str.find locates each marker independently; out of order the slice is
                  # empty and the whole table would be skipped in silence.
                  print(f"::error file={sk}::## 邊界 appears before 本域現有條目 — the entry table would be skipped")
                  fail = True
                  continue
              sec = text[a:b]

              declared = [m.groupdict() for m in COV.finditer(sec)]
              if not declared:
                  print(f"::error file={sk}::no 涵蓋 lines — expected at least one line of the form "
                        f"- `path` · kind · 篩選 `re` — 共 **N** 條，上表 **M** 條，未列 **K** 條")
                  fail = True
                  continue

              pools, bad_src = [], False
              for dec in declared:
                  fp = os.path.join(root, d, dec["path"])
                  if not os.path.isfile(fp):
                      print(f"::error file={sk}::涵蓋 names {dec['path']}, which does not exist under domains/{d}/")
                      fail = True
                      bad_src = True
                      continue
                  body = open(fp, encoding="utf-8", errors="replace").read()
                  raw = yaml_ids(body, fp) if dec["kind"] == "id" else md_headings(body, int(dec["kind"][1]))
                  filt = dec["filt"]
                  if filt == "-":
                      pool = list(raw)
                  else:
                      pool = [x for x in raw if re.search(filt, x) or re.search(filt, strip_lead(x))]
                  n = int(dec["n"])
                  if len(pool) != n:
                      print(f"::error file={sk}::涵蓋 says {dec['path']} [{dec['kind']}] has {n} entries; "
                            f"recomputed {len(pool)}")
                      fail = True
                  pools.append((dec, pool, 0))
              if bad_src:
                  continue

              found = re.findall(r"^\|\s*(?:〈(.+?)〉|`([^`]+)`)\s*\|", sec, re.M)
              if not found:
                  print(f"::error file={sk}::entry table yielded no recognised rows — "
                        f"每列第一欄要是 〈章節名〉 或 `id`")
                  fail = True
                  continue

              counts = [0] * len(pools)
              for h, i in found:
                  rows_checked += 1
                  cited = i or h
                  placed = False
                  for idx, (dec, pool, _) in enumerate(pools):
                      if (dec["kind"] == "id") != bool(i):
                          continue
                      if (cited in pool) if i else head_ok(cited, pool):
                          counts[idx] += 1
                          placed = True
                          break
                  if not placed:
                      print(f"::error file={sk}::table row '{cited}' resolves to none of the 涵蓋 sources")
                      fail = True

              for idx, (dec, pool, _) in enumerate(pools):
                  n, m, k = int(dec["n"]), int(dec["m"]), int(dec["k"])
                  if counts[idx] != m:
                      print(f"::error file={sk}::涵蓋 says {m} rows from {dec['path']} [{dec['kind']}]; "
                            f"the table has {counts[idx]}")
                      fail = True
                  if n - m != k:
                      print(f"::error file={sk}::涵蓋 arithmetic for {dec['path']}: {n} - {m} != {k}")
                      fail = True
              if sum(int(dec["m"]) for dec, _, _ in pools) != len(found):
                  print(f"::error file={sk}::涵蓋 rows total {sum(int(dec['m']) for dec, _, _ in pools)} "
                        f"but the table has {len(found)} rows")
                  fail = True

          # Boundary tables must point at skills that exist. Three of them named
          # `note-writing` while no such skill existed (#29 verify round 2): a
          # dangling handoff reads exactly like a working one.
          existing = {os.path.basename(os.path.dirname(p))
                      for p in glob.glob(os.path.join(skills_root, "*", "SKILL.md"))}
          boundary_checked = 0
          for sk in sorted(glob.glob(os.path.join(skills_root, "*", "SKILL.md"))):
              text = open(sk, encoding="utf-8").read()
              i = text.find("## 邊界")
              if i < 0:
                  continue
              for m in re.finditer(r"^\|[^|]+\|\s*`([^`]+)`", text[i:], re.M):
                  boundary_checked += 1
                  tgt = m.group(1).strip()
                  if tgt not in existing:
                      print(f"::error file={sk}::邊界 points at `{tgt}`, which is not a skill")
                      fail = True

          if rows_checked == 0:
              print("::error::no entry-table rows were inspected")
              fail = True
          if boundary_checked == 0:
              print("::error::no 邊界 targets were inspected")
              fail = True

          print(f"checked {rows_checked} entry-table rows")
          print(f"checked {boundary_checked} 邊界 targets")
          print(f"checked {len(domains)} domains")
          sys.exit(1 if fail else 0)
          EOF
