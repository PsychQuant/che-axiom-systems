name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest JSON validity
        run: |
          jq -e . .claude-plugin/marketplace.json > /dev/null
          jq -e . plugins/che-axiom-systems/.claude-plugin/plugin.json > /dev/null
          echo "both manifests are valid JSON"

      - name: Version sync (marketplace.json == plugin.json)
        run: |
          MV=$(jq -r '.plugins[] | select(.name == "che-axiom-systems") | .version' .claude-plugin/marketplace.json)
          PV=$(jq -r '.version' plugins/che-axiom-systems/.claude-plugin/plugin.json)
          if [ "$MV" != "$PV" ]; then
            echo "::error::version drift — marketplace.json=$MV plugin.json=$PV"
            exit 1
          fi
          echo "versions in sync: $MV"

      - name: Skills frontmatter lint
        run: |
          sudo apt-get install -y python3-yaml > /dev/null 2>&1 || pip install pyyaml > /dev/null
          python3 - <<'EOF'
          import glob, os, re, sys, yaml

          # The frontmatter must PARSE, not merely contain lines that look like
          # `name:` and `description:`. The previous version of this step used
          # `grep -q '^name:'` / `grep -q '^description:'` on raw text, so 11
          # skills whose description contained an unquoted `: ` — which
          # terminates a YAML plain scalar and makes the whole block a parse
          # error — passed CI green while being unloadable (#29 verify).
          #
          # That is the same defect class this repo's 四件套 rule exists to
          # prevent: a check that looks like it guards something it never
          # inspects. Parse it.
          fail = False
          for f in sorted(glob.glob("plugins/che-axiom-systems/skills/*/SKILL.md")):
              slug = os.path.basename(os.path.dirname(f))
              text = open(f, encoding="utf-8").read()
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  print(f"::error file={f}::missing or malformed frontmatter delimiters")
                  fail = True
                  continue
              try:
                  fm = yaml.safe_load(m.group(1))
              except yaml.YAMLError as e:
                  detail = str(e).replace("\n", " ")[:200]
                  print(f"::error file={f}::frontmatter is not valid YAML: {detail}")
                  print(f"::error file={f}::hint — an unquoted ': ' inside a value "
                        f"ends the scalar; wrap the value in double quotes")
                  fail = True
                  continue
              if not isinstance(fm, dict):
                  print(f"::error file={f}::frontmatter must be a mapping")
                  fail = True
                  continue
              for key in ("name", "description"):
                  if not fm.get(key):
                      print(f"::error file={f}::missing or empty {key}:")
                      fail = True
              if fm.get("name") and fm["name"] != slug:
                  print(f"::error file={f}::name '{fm['name']}' != directory '{slug}'")
                  fail = True
          sys.exit(1 if fail else 0)
          EOF

      - name: Domain manifests + INDEX consistency
        run: |
          sudo apt-get install -y python3-yaml > /dev/null 2>&1 || pip install pyyaml > /dev/null
          python3 - <<'EOF'
          import glob, os, sys, yaml

          root = "plugins/che-axiom-systems/domains"
          fail = False

          domains = sorted(
              d for d in os.listdir(root)
              if os.path.isdir(os.path.join(root, d))
          )

          # every domain has a valid manifest with required fields
          for d in domains:
              mf = os.path.join(root, d, "domain.yaml")
              if not os.path.isfile(mf):
                  print(f"::error::{d}: missing domain.yaml")
                  fail = True
                  continue
              m = yaml.safe_load(open(mf))
              for field in ("domain", "description", "format", "maturity", "entry_points"):
                  if field not in m:
                      print(f"::error file={mf}::missing field {field}")
                      fail = True
              if m.get("domain") != d:
                  print(f"::error file={mf}::domain field '{m.get('domain')}' != dir name '{d}'")
                  fail = True
              if m.get("format") not in ("yaml", "markdown", "freeform"):
                  print(f"::error file={mf}::invalid format {m.get('format')}")
                  fail = True
              if m.get("maturity") not in ("bootstrapped", "legacy"):
                  print(f"::error file={mf}::invalid maturity {m.get('maturity')}")
                  fail = True

          # INDEX.md lists exactly the domains that exist
          index = open(os.path.join(root, "INDEX.md")).read()
          for d in domains:
              if f"`{d}`" not in index:
                  print(f"::error::domains/INDEX.md missing entry for {d}")
                  fail = True

          print(f"checked {len(domains)} domains")
          sys.exit(1 if fail else 0)
          EOF
